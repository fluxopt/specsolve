Process-shut_down:
  blocks: the cap is a row here, where PyPSA bounds the variable at 1 as well — a 0-1 binary, or a share in [0, 1] under the linearized relaxation
Link-p-ramp_limit_down:
  negated: the file states the ramp as p[t-1] - p[t] <= rd * p_nom where PyPSA writes p[t] - p[t-1] >= -rd * p_nom — the same row negated, so its dual is the negative
Process-p-ramp_limit_down:
  negated: the file states the ramp as p[t-1] - p[t] <= rd * p_nom where PyPSA writes p[t] - p[t-1] >= -rd * p_nom — the same row negated, so its dual is the negative
objective_constant:
  structure: PyPSA carries a nonzero objective constant as a fixed variable of that name; the file states no constant, and the objective is compared net of it
solver model:
  structure: what the file states otherwise than PyPSA writes it — the objective_constant variable's column and row (rungs 11, 13), the build's floor and cap once rather than once per scenario (rung 14), a fixed build's pin once rather than once per scenario (rung 57)
objective:
  blocks: PyPSA's objective carries its fixed objective_constant variable as a term; the file states no constant, and the objective value is compared net of it
Generator-p-ramp_limit_down:
  negated: the initial-snapshot block states −p on the left where PyPSA writes p[t] − p[t−1] ≥ −rd·p_nom — the same row negated, so its dual is the negative
Line-loss_secants-pos:
  structure: one segment dimension for lines and transformers, where PyPSA places secants per component — the component with fewer secants takes the zero cut, loss >= 0, at the segments it lacks (rung 23)
  blocks: one segment dimension for lines and transformers, where PyPSA places secants per component — the component with fewer secants takes the zero cut, loss >= 0, at the segments it lacks (rung 23)
Line-loss_secants-neg:
  structure: one segment dimension for lines and transformers, where PyPSA places secants per component — the component with fewer secants takes the zero cut, loss >= 0, at the segments it lacks (rung 23)
  blocks: one segment dimension for lines and transformers, where PyPSA places secants per component — the component with fewer secants takes the zero cut, loss >= 0, at the segments it lacks (rung 23)
Generator-p_nom_set:
  structure: the file pins a build once over the generator, where PyPSA writes the same pin once per scenario; PyPSA refuses a p_nom_set that differs by scenario (rung 57)
  blocks: the file pins a build once over the generator, where PyPSA writes the same pin once per scenario; PyPSA refuses a p_nom_set that differs by scenario (rung 57)
Generator-marginal_cost_piecewise_chord:
  blocks: the expanded curve keys a segment's line by its upper breakpoint and states it times the segment's width, where linopy keys it by the segment and divides the width out
  duals: the expanded curve keys a segment's line by `breakpoint`, linopy by `_breakpoint_piece`, so no row joins, and the rows differ by the segment's width
Generator-marginal_cost_piecewise_domain_lo:
  blocks: the expanded curve keys the floor of the curve's domain by its first breakpoint, where linopy writes one row per unit and snapshot
  duals: the expanded curve keys the floor of the domain by `breakpoint`, which linopy's row has no coordinate for
Generator-marginal_cost_piecewise_domain_hi:
  blocks: the expanded curve keys the cap of the curve's domain by its last breakpoint, where linopy writes one row per unit and snapshot
  duals: the expanded curve keys the cap of the domain by `breakpoint`, which linopy's row has no coordinate for
Generator-marginal_cost_piecewise_active_bound:
  structure: a row per segment of a curve the status gates, where linopy also writes `delta <= 1` for a curve no status gates, which the variable's bound states, and a row at each padded segment of a curve shorter than the longest
  blocks: a row per segment of a curve the status gates, where linopy also writes `delta <= 1` for a curve no status gates, which the variable's bound states, and a row at each padded segment of a curve shorter than the longest
Generator-marginal_cost_piecewise_delta_bound:
  structure: a row per segment a curve has, where linopy also writes one at each padded segment of a curve shorter than the longest, with no segment variable in it
Generator-marginal_cost_piecewise_fill_order:
  structure: a row per pair of consecutive segments, where linopy also writes one at the last segment of each curve, with nothing after it
  blocks: the expanded curve keys the order of two segments by the later one, linopy by the earlier, and linopy also writes a row at the last segment of each curve, with nothing after it
Generator-marginal_cost_piecewise_binary_order:
  structure: a row per pair of consecutive segments, where linopy also writes one at the last segment of each curve, with nothing after it
  blocks: the expanded curve keys the order of two segments by the later one, linopy by the earlier, and linopy also writes a row at the last segment of each curve, with nothing after it
Generator-marginal_cost_piecewise_link:
  structure: two blocks, one where the status gates the curve and one where it does not, where linopy writes one row per unit and snapshot
  blocks: the expanded curve keys the output's link by the curve's first breakpoint, where linopy keys it by the variable it links
Generator-marginal_cost_piecewise_output_link:
  structure: two blocks, one where the status gates the curve and one where it does not, where linopy writes one row per unit and snapshot
  blocks: the expanded curve keys the cost's link by the curve's first breakpoint, where linopy writes one row per unit and snapshot
