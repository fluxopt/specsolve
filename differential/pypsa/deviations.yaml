# Every place specsolve's model is allowed to differ from PyPSA's, with the reason.
#
# Keyed by the PyPSA name (a row or column of `n.model`, or a global-constraint
# type). `structure` explains a row or column count that differs; `blocks`
# explains a label-for-label difference the file states on purpose; `duals`
# explains a dual the comparison cannot reach at all. The parity runner fails on
# a difference recorded nowhere here, and on a reason no rung needs any more;
# the ladder index shows each one beside the count it explains.
#
# `negated` is the one entry that is checked rather than excused: it says the
# file writes PyPSA's row negated, so the runner compares our dual against the
# negative of theirs at the same tolerance. A difference that survives the
# negation is still red.
#
#   StorageUnit-energy_balance:
#     structure: three blocks — carried, initial, cyclic — where PyPSA masks one row three ways
operational_limit:
  structure: one block per sense — ==, <=, >= — where PyPSA writes one row per labelled constraint whatever its sense
primary_energy:
  structure: one block per sense — ==, <=, >= — where PyPSA writes one row per labelled constraint whatever its sense
tech_capacity_expansion_limit:
  structure: one block per sense — ==, <=, >= — where PyPSA writes one row per labelled constraint whatever its sense
transmission_expansion_cost_limit:
