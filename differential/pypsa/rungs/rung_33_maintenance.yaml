description: A plain `n.optimize()`, and its multi-period and stochastic classes, in one file. Every second-stage
  quantity spans a `scenario` (a future dispatch is chosen in) and every asset stands in the investment
  `period`s its build year and lifetime span. A parameter spans `scenario` exactly when PyPSA reads it
  per scenario. Capacity is chosen once, before the future is known, and paid once per active period at
  its cost in expectation over the scenarios; operation is the expectation over the scenarios' weights,
  with a share priced at the tail through the CVaR rows, which stand only where that share is positive.
  A plain run feeds one scenario, one period, all-active masks and unit weights, and the model collapses
  to the standard one. A security-constrained run copies each branch flow limit once per outage in an
  `outage` set that a plain run leaves empty. Which snapshots an asset is active in, a scenario's weight,
  and the outage factors are data prep.
dimensions:
  scenario: {description: 'the futures dispatch is chosen in, each with a weight'}
  snapshot: {description: dispatch periods, dtype: datetime}
  bus: {description: network nodes}
  generator: {description: 'generating units, each on one bus'}
  link: {description: 'controllable connections, each from one bus to the buses it delivers to'}
  link_output: {description: 'a link''s output ports, one label per port a link declares — PyPSA''s `bus1`,
      `bus2`, … columns read long, so a link of any number of output ports is one term in the balance,
      data prep'}
  process: {description: 'generalized multi-port converters, each with an internal power that every port
      draws or delivers at its own rate'}
  process_output: {description: 'a process''s ports, one label per port a process declares — PyPSA''s
      `bus0`, `bus1`, … each carry a signed `rate`, so a process of any number of ports is one term in
      the balance, data prep'}
  load: {description: 'demands, each on one bus'}
  period: {description: investment periods — PyPSA's `investment_periods`, dtype: int}
relations:
  snapshot_period: {description: the investment period a snapshot falls in, key: snapshot, values: period}
  Generator_bus: {description: the bus a generator sits on, key: generator, values: bus}
  Link_bus0: {description: the bus a link leaves, key: link, values: bus}
  Link_output_link: {description: the link an output port belongs to, key: link_output, values: link}
  Link_output_bus: {description: 'the bus an output port delivers to — PyPSA''s `bus1`, `bus2`, … columns.
      A link of three output ports is three labels here rather than a third relation, so the file states
      any number of them', key: link_output, values: bus}
  Process_output_process: {description: the process a port belongs to, key: process_output, values: process}
  Process_output_bus: {description: 'the bus a port draws from or delivers to — PyPSA''s `bus0`, `bus1`,
      … columns. A process of three ports is three labels here rather than a third relation, so the file
      states any number of them', key: process_output, values: bus}
  Load_bus: {description: the bus a load sits on, key: load, values: bus}
  Generator_maintenance_cover:
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario,
      the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`,
      data prep; no rows for a generator that is not maintainable
    key:
      scenario: scenario
      generator: generator
      start: snapshot
      covered: snapshot
  Link_maintenance_cover:
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario,
      the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`,
      data prep; no rows for a link that is not maintainable
    key:
      scenario: scenario
      link: link
      start: snapshot
      covered: snapshot
  Process_maintenance_cover:
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario,
      the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`,
      data prep; no rows for a process that is not maintainable
    key:
      scenario: scenario
      process: process
      start: snapshot
      covered: snapshot
parameters:
  snapshot_weightings_objective:
    description: PyPSA's `snapshot_weightings.objective` — hours a snapshot stands for in the cost
    dims: [snapshot]
  Generator_p_nom:
    description: nominal power
    dims: [scenario, generator]
  Generator_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [generator]
    dtype: bool
  Generator_p_min_pu:
    description: least output, per unit of nominal power
    dims: [scenario, snapshot, generator]
  Generator_p_max_pu:
    description: most output, per unit of nominal power — an availability profile
    dims: [scenario, snapshot, generator]
  Generator_marginal_cost:
    description: cost of one unit of output
    dims: [scenario, snapshot, generator]
  Generator_marginal_cost_quadratic:
    description: cost of the square of one unit of output
    dims: [scenario, snapshot, generator]
  Generator_sign:
    description: the sign output enters its bus's balance with — PyPSA's `sign`, `1` unless given, `-1`
      for a unit that draws power. PyPSA refuses one that differs by scenario (`consistency.py:1187`)
    dims: [generator]
  Generator_committable:
    description: whether output is gated by an on/off status decision
    dims: [generator]
    dtype: bool
  Generator_p_nom_mod:
    description: the module size a build comes in whole numbers of; no value means the build is continuous
    dims: [generator]
  Generator_maintainable:
    description: whether a generator must be taken off for maintenance within the horizon — in any scenario,
      as PyPSA takes the union over them (`components.py:1016-1019`)
    dims: [generator]
    dtype: bool
  Generator_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, generator]
  Generator_maintenance_events:
    description: how many maintenance events the horizon holds
    dims: [scenario, generator]
    dtype: int
  Generator_maintenance_start_blocked:
    description: true where no maintenance event may start, because the snapshots it would cover run past
      the end of the horizon or into one the generator does not stand in — PyPSA's `active & ~valid`,
      from `maintenance_duration` and the generator weightings, data prep
    dims: [scenario, snapshot, generator]
    dtype: bool
  Link_p_nom:
    description: nominal power
    dims: [scenario, link]
  Link_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [link]
    dtype: bool
  Link_p_min_pu:
    description: least flow, per unit of nominal power — negative for a link that carries both ways
    dims: [scenario, snapshot, link]
  Link_p_max_pu:
    description: most flow, per unit of nominal power
    dims: [scenario, snapshot, link]
  Link_efficiency:
    description: share of the flow that arrives at an output port, PyPSA's `efficiency`, `efficiency2`,
      … read long — negative where that port consumes rather than delivers. Read at the snapshot the flow
      arrives, so a delayed port delivers at its arrival snapshot's efficiency (`constraints.py:1522`)
    dims: [scenario, snapshot, link_output]
  Link_output_delay:
    description: snapshots a port's delivery lags its link's flow — PyPSA's `delay`, `delay2`, … read
      long, in `snapshot_weightings.generators` units, which the file states as whole snapshots; zero
      for a port that delivers at once. Each scenario takes its own. PyPSA `1.3.0` groups the ports by
      delay over all scenarios and shifts each group in every one, so a delay that differs by scenario
      delivers the flow twice (`constraints.py:1269-1276`, PyPSA/PyPSA#1941)
    dims: [scenario, link_output]
    dtype: int
  Link_output_cyclic_delay:
    description: whether a delayed port's flow wraps from the end of its investment period — PyPSA's `cyclic_delay`,
      `cyclic_delay2`, …; where it does not, the flow still in transit at each period's first snapshots
      is lost. Each scenario takes its own, as the delay
    dims: [scenario, link_output]
    dtype: bool
  Link_marginal_cost:
    description: cost of one unit of flow
    dims: [scenario, snapshot, link]
  Link_marginal_cost_quadratic:
    description: cost of the square of one unit of flow
    dims: [scenario, snapshot, link]
  Link_committable:
    description: whether flow is gated by an on/off status decision
    dims: [link]
    dtype: bool
  Link_p_nom_mod:
    description: the module size a build comes in whole numbers of; no value means the build is continuous
    dims: [link]
  Link_maintainable:
    description: whether a link must be taken off for maintenance within the horizon — in any scenario,
      as PyPSA takes the union over them (`components.py:1016-1019`)
    dims: [link]
    dtype: bool
  Link_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, link]
  Link_maintenance_events:
    description: how many maintenance events the horizon holds
    dims: [scenario, link]
    dtype: int
  Link_maintenance_start_blocked:
    description: true where no maintenance event may start, because the snapshots it would cover run past
      the end of the horizon or into one the link does not stand in — PyPSA's `active & ~valid`, from
      `maintenance_duration` and the generator weightings, data prep
    dims: [scenario, snapshot, link]
    dtype: bool
  Process_p_nom:
    description: nominal internal power
    dims: [scenario, process]
  Process_p_nom_extendable:
    description: whether the nominal internal power is a decision
    dims: [process]
    dtype: bool
  Process_p_min_pu:
    description: least internal power, per unit of nominal power — negative for a process that runs both
      ways
    dims: [scenario, snapshot, process]
  Process_p_max_pu:
    description: most internal power, per unit of nominal power
    dims: [scenario, snapshot, process]
  Process_rate:
    description: the energy a port draws or delivers per unit of internal power, PyPSA's `rate0`, `rate1`,
      … read long — negative where the port withdraws, positive where it injects; a link is a process
      whose `bus0` rate is minus one and whose output rates are its efficiencies. Read at the snapshot
      the transfer arrives, so a delayed port transfers at its arrival snapshot's rate (`constraints.py:1522`)
    dims: [scenario, snapshot, process_output]
  Process_output_delay:
    description: snapshots a port's transfer lags its process's internal power — PyPSA's `delay0`, `delay1`,
      … read long, in `snapshot_weightings.generators` units, which the file states as whole snapshots;
      zero for a port that transfers at once. Each scenario takes its own, as a link's
    dims: [scenario, process_output]
    dtype: int
  Process_output_cyclic_delay:
    description: whether a delayed port's transfer wraps from the end of its investment period — PyPSA's
      `cyclic_delay0`, `cyclic_delay1`, …; where it does not, the energy still in transit at each period's
      first snapshots is lost. Each scenario takes its own, as the delay
    dims: [scenario, process_output]
    dtype: bool
  Process_marginal_cost:
    description: cost of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_marginal_cost_quadratic:
    description: cost of the square of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_p_nom_min:
    description: least nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_p_nom_max:
    description: most nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_capital_cost:
    description: cost of one unit of nominal power — PyPSA's `capital_cost`, periodized as an annuity
      in data prep
    dims: [scenario, process]
  Process_committable:
    description: whether internal power is gated by an on/off status decision
    dims: [process]
    dtype: bool
  Process_p_nom_mod:
    description: the module size a build comes in whole numbers of; no value means the build is continuous
    dims: [process]
  Process_maintainable:
    description: whether a process must be taken off for maintenance within the horizon — in any scenario,
      as PyPSA takes the union over them (`components.py:1016-1019`)
    dims: [process]
    dtype: bool
  Process_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, process]
  Process_maintenance_events:
    description: how many maintenance events the horizon holds
    dims: [scenario, process]
    dtype: int
  Process_maintenance_start_blocked:
    description: true where no maintenance event may start, because the snapshots it would cover run past
      the end of the horizon or into one the process does not stand in — PyPSA's `active & ~valid`, from
      `maintenance_duration` and the generator weightings, data prep
    dims: [scenario, snapshot, process]
    dtype: bool
  Load_p_set:
    description: demand
    dims: [scenario, snapshot, load]
  Load_sign:
    description: the sign a load's demand enters its bus's balance with — PyPSA's `sign`, `-1` unless
      given, `1` for a load that feeds its bus. PyPSA refuses one that differs by scenario (`consistency.py:1187`)
    dims: [load]
  Load_active:
    description: whether a load stands in the model — PyPSA's `active`. A load has no build year and no
      lifetime, so the flag holds in every snapshot. PyPSA refuses one that differs by scenario (`consistency.py:1195`)
    dims: [load]
    dtype: bool
  scenario_weight:
    description: PyPSA's `scenario_weightings.weight` — the probability of a future
    dims: [scenario]
  CVaR_omega:
    description: PyPSA's `risk_preference['omega']` — the share of operating cost priced at the tail rather
      than in expectation; zero recovers the risk-neutral model
    dims: []
  period_weight_objective:
    description: PyPSA's `investment_period_weightings.objective` — what a period's cost weighs
    dims: [period]
  Generator_active:
    description: whether a generator stands in a snapshot's period — PyPSA's `active`, from build year
      and lifetime, data prep
    dims: [snapshot, generator]
    dtype: bool
  Link_active:
    description: whether a link stands in a snapshot's period — PyPSA's `active`, data prep
    dims: [snapshot, link]
    dtype: bool
  Process_active:
    description: whether a process stands in a snapshot's period — PyPSA's `active`, data prep
    dims: [snapshot, process]
    dtype: bool
  Generator_capital_weight:
    description: the sum of period weights a generator stands in — PyPSA's `active * period_weighting`,
      summed, data prep
    dims: [generator]
  Link_capital_weight:
    description: the sum of period weights a link stands in — PyPSA's `active * period_weighting`, summed,
      data prep
    dims: [link]
  Process_capital_weight:
    description: the sum of period weights a process stands in — PyPSA's `active * period_weighting`,
      summed, data prep
    dims: [process]
  Generator_p_nom_min:
    description: least nominal power an extendable generator may be built at
    dims: [scenario, generator]
  Generator_p_nom_max:
    description: most nominal power an extendable generator may be built at
    dims: [scenario, generator]
  Generator_capital_cost:
    description: cost of one unit of nominal power — PyPSA's `capital_cost`, periodized as an annuity
      in data prep
    dims: [scenario, generator]
  Link_p_nom_min:
    description: least nominal power an extendable link may be built at
    dims: [scenario, link]
  Link_p_nom_max:
    description: most nominal power an extendable link may be built at
    dims: [scenario, link]
  Link_capital_cost:
    description: cost of one unit of nominal power — PyPSA's `capital_cost`, periodized as an annuity
      in data prep
    dims: [scenario, link]
variables:
  Generator_p:
    description: '`Generator-p` — output of a generator in a snapshot'
    dims: [scenario, snapshot, generator]
    where: Generator_active
  Link_p:
    description: '`Link-p` — PyPSA''s `p0`, the flow measured at the `Link_bus0` end: a positive value
      withdraws there and injects at every bus the link''s output ports deliver to'
    dims: [scenario, snapshot, link]
    where: Link_active
  Process_p:
    description: '`Process-p` — PyPSA''s internal power `p`: a positive value drives every port at its
      own rate, withdrawing where the rate is negative and injecting where it is positive'
    dims: [scenario, snapshot, process]
    where: Process_active
  Generator_maintenance:
    description: '`Generator-maintenance` — whether a maintainable generator is in maintenance: continuous,
      and one exactly where an event covers the snapshot'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    absence: zero
    bounds: {lower: 0, upper: 1}
  Generator_maintenance_start:
    description: '`Generator-maintenance_start` — whether a maintenance event starts in this snapshot'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    absence: zero
    domain: binary
  Generator_maintenance_capacity:
    description: '`Generator-maintenance_capacity` — the chosen build while in maintenance, zero otherwise:
      the product the `maintcap` rows linearize'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod
      > 0) AND Generator_active
    absence: zero
    bounds: {lower: 0}
  Link_maintenance:
    description: '`Link-maintenance` — whether a maintainable link is in maintenance: continuous, and
      one exactly where an event covers the snapshot'
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    absence: zero
    bounds: {lower: 0, upper: 1}
  Link_maintenance_start:
    description: '`Link-maintenance_start` — whether a maintenance event starts in this snapshot'
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    absence: zero
    domain: binary
  Link_maintenance_capacity:
    description: '`Link-maintenance_capacity` — the chosen build while in maintenance, zero otherwise:
      the product the `maintcap` rows linearize'
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_p_nom_extendable AND NOT (Link_committable AND Link_p_nom_mod >
      0) AND Link_active
    absence: zero
    bounds: {lower: 0}
  Process_maintenance:
    description: '`Process-maintenance` — whether a maintainable process is in maintenance: continuous,
      and one exactly where an event covers the snapshot'
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    absence: zero
    bounds: {lower: 0, upper: 1}
  Process_maintenance_start:
    description: '`Process-maintenance_start` — whether a maintenance event starts in this snapshot'
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    absence: zero
    domain: binary
  Process_maintenance_capacity:
    description: '`Process-maintenance_capacity` — the chosen build while in maintenance, zero otherwise:
      the product the `maintcap` rows linearize'
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_p_nom_extendable AND NOT (Process_committable AND Process_p_nom_mod
      > 0) AND Process_active
    absence: zero
    bounds: {lower: 0}
  Generator_p_nom_ext:
    description: '`Generator-p_nom` — nominal power where it is a decision; the parameter of the same
      PyPSA name carries the fixed regime'
    dims: [generator]
    where: Generator_p_nom_extendable
  Link_p_nom_ext:
    description: '`Link-p_nom` — nominal power where it is a decision; the parameter of the same PyPSA
      name carries the fixed regime'
    dims: [link]
    where: Link_p_nom_extendable
  Process_p_nom_ext:
    description: '`Process-p_nom` — nominal internal power where it is a decision; the parameter of the
      same PyPSA name carries the fixed regime'
    dims: [process]
    where: Process_p_nom_extendable
  CVaR_a:
    description: '`CVaR-a` — how far a scenario''s operating cost exceeds the tail''s start; nothing where
      it does not'
    dims: [scenario]
    bounds: {lower: 0}
  CVaR_theta:
    description: '`CVaR-theta` — where the tail starts, the value at risk'
    dims: []
  CVaR:
    description: '`CVaR` — the tail''s average cost, what the objective prices at `omega`'
    dims: []
constraints:
  Generator_fix_p_lower:
    description: '`Generator-fix-p-lower` — a fixed generator outputs at least its minimum'
    dims: [scenario, snapshot, generator]
    where: not Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p >= Generator_p_min_pu * Generator_p_nom * (1 - Generator_maintenance_pu *
      Generator_maintenance)
  Generator_fix_p_upper:
    description: '`Generator-fix-p-upper` — a fixed generator outputs at most what is available'
    dims: [scenario, snapshot, generator]
    where: not Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p <= Generator_p_max_pu * Generator_p_nom * (1 - Generator_maintenance_pu *
      Generator_maintenance)
  Link_fix_p_lower:
    description: '`Link-fix-p-lower` — a fixed link carries at least its minimum, negative for the other
      way'
    dims: [scenario, snapshot, link]
    where: not Link_p_nom_extendable AND not Link_committable AND Link_active
    expression: Link_p >= Link_p_min_pu * Link_p_nom * (1 - Link_maintenance_pu * Link_maintenance)
  Link_fix_p_upper:
    description: '`Link-fix-p-upper` — a fixed link carries at most its nominal power'
    dims: [scenario, snapshot, link]
    where: not Link_p_nom_extendable AND not Link_committable AND Link_active
    expression: Link_p <= Link_p_max_pu * Link_p_nom * (1 - Link_maintenance_pu * Link_maintenance)
  Generator_ext_p_lower:
    description: '`Generator-ext-p-lower` — an extendable generator outputs at least its minimum of the
      chosen build'
    dims: [scenario, snapshot, generator]
    where: Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p >= Generator_p_min_pu * (Generator_p_nom_ext - Generator_maintenance_pu *
      Generator_maintenance_capacity)
  Generator_ext_p_upper:
    description: '`Generator-ext-p-upper` — an extendable generator outputs at most what is available
      of the chosen build'
    dims: [scenario, snapshot, generator]
    where: Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p <= Generator_p_max_pu * (Generator_p_nom_ext - Generator_maintenance_pu *
      Generator_maintenance_capacity)
  Generator_ext_p_nom_lower:
    description: '`Generator-ext-p_nom-lower` — the chosen build is at least its floor in every scenario'
    dims: [scenario, generator]
    where: Generator_p_nom_extendable
    expression: Generator_p_nom_ext >= Generator_p_nom_min
  Generator_ext_p_nom_upper:
    description: '`Generator-ext-p_nom-upper` — the chosen build is at most its cap in every scenario;
      a cap of infinity is no row'
    dims: [scenario, generator]
    where: Generator_p_nom_extendable AND Generator_p_nom_max
    expression: Generator_p_nom_ext <= Generator_p_nom_max
  Link_ext_p_lower:
    description: '`Link-ext-p-lower` — an extendable link carries at least its minimum of the chosen build,
      negative for the other way'
    dims: [scenario, snapshot, link]
    where: Link_p_nom_extendable AND not Link_committable AND Link_active
    expression: Link_p >= Link_p_min_pu * (Link_p_nom_ext - Link_maintenance_pu * Link_maintenance_capacity)
  Link_ext_p_upper:
    description: '`Link-ext-p-upper` — an extendable link carries at most the chosen build'
    dims: [scenario, snapshot, link]
    where: Link_p_nom_extendable AND not Link_committable AND Link_active
    expression: Link_p <= Link_p_max_pu * (Link_p_nom_ext - Link_maintenance_pu * Link_maintenance_capacity)
  Link_ext_p_nom_lower:
    description: '`Link-ext-p_nom-lower` — the chosen build is at least its floor in every scenario'
    dims: [scenario, link]
    where: Link_p_nom_extendable
    expression: Link_p_nom_ext >= Link_p_nom_min
  Link_ext_p_nom_upper:
    description: '`Link-ext-p_nom-upper` — the chosen build is at most its cap in every scenario; a cap
      of infinity is no row'
    dims: [scenario, link]
    where: Link_p_nom_extendable AND Link_p_nom_max
    expression: Link_p_nom_ext <= Link_p_nom_max
  Process_fix_p_lower:
    description: '`Process-fix-p-lower` — a fixed process runs at least its minimum, negative for the
      other way'
    dims: [scenario, snapshot, process]
    where: not Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p >= Process_p_min_pu * Process_p_nom * (1 - Process_maintenance_pu * Process_maintenance)
  Process_fix_p_upper:
    description: '`Process-fix-p-upper` — a fixed process runs at most its nominal power'
    dims: [scenario, snapshot, process]
    where: not Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p <= Process_p_max_pu * Process_p_nom * (1 - Process_maintenance_pu * Process_maintenance)
  Process_ext_p_lower:
    description: '`Process-ext-p-lower` — an extendable process runs at least its minimum of the chosen
      build, negative for the other way'
    dims: [scenario, snapshot, process]
    where: Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p >= Process_p_min_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
  Process_ext_p_upper:
    description: '`Process-ext-p-upper` — an extendable process runs at most the chosen build'
    dims: [scenario, snapshot, process]
    where: Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p <= Process_p_max_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
  Process_ext_p_nom_lower:
    description: '`Process-ext-p_nom-lower` — the chosen build is at least its floor in every scenario'
    dims: [scenario, process]
    where: Process_p_nom_extendable
    expression: Process_p_nom_ext >= Process_p_nom_min
  Process_ext_p_nom_upper:
    description: '`Process-ext-p_nom-upper` — the chosen build is at most its cap in every scenario; a
      cap of infinity is no row'
    dims: [scenario, process]
    where: Process_p_nom_extendable AND Process_p_nom_max
    expression: Process_p_nom_ext <= Process_p_nom_max
  Generator_maint_event_count:
    description: '`Generator-maint-event-count` — a maintainable generator holds its number of maintenance
      events over the horizon'
    dims: [scenario, generator]
    where: Generator_maintainable
    expression: sum(Generator_maintenance_start, over=snapshot) == Generator_maintenance_events
  Generator_maint_window:
    description: '`Generator-maint-window` — a generator is in maintenance exactly where an event it started
      covers the snapshot; two events do not overlap, since the maintenance status is at most one'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    expression: Generator_maintenance == sum(Generator_maintenance_start, by=Generator_maintenance_cover,
      over=start, into=covered)
  Generator_maint_start_horizon:
    description: '`Generator-maint-start-horizon` — no event starts where it could not run its whole duration'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active AND Generator_maintenance_start_blocked
    expression: Generator_maintenance_start == 0
  Generator_maintcap_upper:
    description: '`Generator-maintcap_upper` — the build taken off is at most the chosen build in maintenance,
      and at most the build less its floor out of it'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod
      > 0) AND Generator_active
    expression: Generator_maintenance_capacity <= Generator_p_nom_ext - Generator_p_nom_min * (1 - Generator_maintenance)
  Generator_maintcap_upper_nommax:
    description: '`Generator-maintcap_upper_nommax` — out of maintenance, no build is taken off'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod
      > 0) AND Generator_active
    expression: Generator_maintenance_capacity <= Generator_p_nom_max * Generator_maintenance
  Generator_maintcap_lower_nommax:
    description: '`Generator-maintcap_lower_nommax` — in maintenance, the whole chosen build is taken
      off'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod
      > 0) AND Generator_active
    expression: Generator_maintenance_capacity >= Generator_p_nom_ext - Generator_p_nom_max * (1 - Generator_maintenance)
  Generator_maintcap_lower_nommin:
    description: '`Generator-maintcap_lower_nommin` — in maintenance, at least the floor of the build
      is taken off'
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod
      > 0) AND Generator_active AND Generator_p_nom_min > 0
    expression: Generator_maintenance_capacity >= Generator_p_nom_min * Generator_maintenance
  Link_maint_event_count:
    description: '`Link-maint-event-count` — a maintainable link holds its number of maintenance events
