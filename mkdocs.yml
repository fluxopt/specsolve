site_name: specsolve
site_description: Self-documenting optimisation models — declarative LP/MILP, built relationally and handed straight to the solver
site_url: https://specsolve.readthedocs.io/en/latest/
repo_url: https://github.com/fluxopt/specsolve
repo_name: fluxopt/specsolve
edit_uri: edit/main/docs/
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

