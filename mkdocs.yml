theme:
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to system preference

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # Safe with MathJax because docs/javascripts/mathjax.js re-typesets on `document$`.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's slug rules, so an anchor resolves the same on GitHub and on the site.
      slugify: { object: pymdownx.slugs.slugify, kwds: { case: lower } }
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
        # A ```math fence hands its body to arithmatex, as GitHub renders it.
        - name: math
          class: arithmatex
          format: { object: pymdownx.arithmatex.arithmatex_fenced_format, kwds: { which: generic } }
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  # Rewrites the GitHub inline math mathspec prints into the `$…$` arithmatex reads.
  - tools.mdx_github_math
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: zensical.extensions.emoji.twemoji
      emoji_generator: zensical.extensions.emoji.to_svg

plugins:
  - search
  - markdown-exec
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          # The language's errors are re-exported from mathspec, and render from its source.
          load_external_modules: true
          options:
            # The tree documents attributes with `#:` comments.
            extensions:
              - griffe_sphinx
            docstring_style: google
            docstring_section_style: spacy
            filters:
              - "!^_"
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            show_if_no_docstring: true
            signature_crossrefs: true
            scoped_crossrefs: true
            show_signature_annotations: false
            separate_signature: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/benchmarks.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fluxopt/specsolve
      name: specsolve on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/specsolve/
      name: specsolve on PyPI

extra_javascript:
  - javascripts/mathjax.js
  - path: javascripts/benchmarks.js
    type: module
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

watch:
  - docs
  - README.md
  - CHANGELOG.md
