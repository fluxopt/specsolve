manifest: 1
spec: ../dispatch.yaml
sources: [data/base.xlsx, data/timeseries/]
solver_name: highs
solver_options: {time_limit: 600}
archive: runs/

runs:
  base: {}
  high_gas:
    sources: [data/high_gas.xlsx]
  scenarios:
    from: high_gas
    sources: [data/scenarios/load.parquet]
    axis: {EachCoordinate: {dim: scenario}}
    workers: 2
