description: >-
  PyPSA linear optimal power flow at its smallest: a transport model — linear
  marginal cost, controllable links, no voltage law. Optimum 22000.0, from PyPSA itself.

dimensions:
  snapshot:
    description: dispatch periods
    dtype: int
    ordered: true
  bus:
    description: network nodes
    dtype: str
  generator:
    description: generating units, each sitting on one bus
    dtype: str
  link:
    description: controllable connections, each joining two buses
    dtype: str

properties:
  generator:
    bus:
      description: the bus a generator sits on
      into: bus
  link:
    from_bus:
      description: the bus a link leaves
      into: bus
    to_bus:
      description: the bus a link arrives at
      into: bus


parameters:
  p_nom:
    description: installed capacity of a generator
    dims: [generator]
  marginal_cost:
    description: cost of one unit of output
    dims: [generator]
  rating:
    description: most a link may carry towards its `link[to_bus]` bus
    dims: [link]
  neg_rating:
    description: most a link may carry the other way, negative by convention
    dims: [link]
  load:
    description: demand at each bus in each snapshot
    dims: [snapshot, bus]

variables:
  p:
    description: output of a generator in a snapshot
    dims: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_nom
  f:
    description: >-
      PyPSA's p0 — flow measured at the link's `link[from_bus]` end, so a positive value
      withdraws there and injects at `link[to_bus]`
    dims: [snapshot, link]
    bounds:
      lower: neg_rating
      upper: rating

constraints:
  nodal_balance:
    description: what is generated at a bus plus what arrives over the links meets the load there
    dims: [snapshot, bus]
    expression: >-
      sum(p, over=generator, by=generator[bus])
      + sum(f, over=link, by=link[to_bus])
      - sum(f, over=link, by=link[from_bus])
      == load

objective:
  sense: minimize
  description: total cost of generation; moving power over a link is free here
  expression: sum(p * marginal_cost)
