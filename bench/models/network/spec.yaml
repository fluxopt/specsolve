# A network of buses: the shape of a small PyPSA dispatch model.
#
# Each of the other published cases isolates one thing. This one has them
# together, as a model somebody actually builds: buses joined by lines
# (`transport`'s joins), a store at every bus whose state carries over time
# (`storage`'s recurrence), a technology portfolio that exists only at the
# buses it is installed at (`nodal`'s mask), and five variable declarations
# rather than one.
#
# `p_max` is installed capacity times availability per snapshot, PyPSA's
# `p_max_pu`, so solar is zero at night and storage has a reason to cycle. It
# has a row for every installed pair in every snapshot, and none elsewhere.
#
# A store starts empty, PyPSA's default, rather than wrapping around the
# horizon: a cyclic store admits the same charging whichever way time runs, so
# a model with its time index reversed would solve to the same objective.
#
# Every installed plant draws from one pool, a fuel contract or an emission
# budget, and a pool caps what its plants generate in each snapshot. Pools are
# drawn per plant, so `bus_tech[pool]` is keyed by the (bus, tech) pair, and the cap
# sums `p` over both of its sparse dimensions at once.
dimensions:
  snapshot:
    dtype: int
    ordered: true
  bus:
    dtype: str
  tech:
    dtype: str
  line:
    dtype: str
  store:
    dtype: str
  pool:
    dtype: str

sets:
  bus_tech: { dims: [bus, tech], missing: absent }

properties:
  line:
    from_bus: bus
    to_bus: bus
  store:
    bus: bus
  bus_tech:
    pool: pool

parameters:
  installed:            # capacity of `tech` at `bus`; absent pairs are not installed
    dims: [bus, tech]
    missing: 0
  p_max:                # installed capacity times availability
    dims: [snapshot, bus, tech]
    missing: absent
  cost:
    dims: [tech]
  cap:
    dims: [line]
  neg_cap:
    dims: [line]
  e_max:
    dims: [store]
  p_store:
    dims: [store]
  eta:
    dims: [store]
  load:
    dims: [snapshot, bus]
  limit:                # what a pool's plants may generate together, per snapshot
    dims: [pool]

variables:
  p:
    dims: [snapshot, bus, tech]
    where: "installed > 0"
    bounds:
      lower: 0
      upper: p_max
  f:
    dims: [snapshot, line]
    bounds:
      lower: neg_cap
      upper: cap
  charge:
    dims: [snapshot, store]
    bounds:
      lower: 0
      upper: p_store
  discharge:
    dims: [snapshot, store]
    bounds:
      lower: 0
      upper: p_store
  soc:
    dims: [snapshot, store]
    bounds:
      lower: 0
      upper: e_max

constraints:
  balance:
    dims: [snapshot, bus]
    expression: >-
      sum(p, over=tech)
      + sum(f, over=line, by=line[to_bus]) - sum(f, over=line, by=line[from_bus])
      + sum(discharge, over=store, by=store[bus]) - sum(charge, over=store, by=store[bus])
      == load
  soc_balance:
    dims: [snapshot, store]
    expression: soc == shift(soc, along=snapshot, offset=1, edge=0) + charge * eta - discharge
  pool_cap:
    dims: [snapshot, pool]
    expression: sum(p, over=[bus, tech], by=bus_tech[pool]) <= limit

objective:
  sense: minimize
  expression: sum(p * cost)
