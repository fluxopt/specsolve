# examples/transport.yaml verbatim, kept here so a bench model never changes
# because an example was edited for documentation reasons. Three sum
# calls per balance row: the join-heavy shape.
dimensions:
  snapshot:
    dtype: int
    ordered: true
  generator:
    dtype: str
  bus:
    dtype: str
  line:
    dtype: str

properties:
  generator:
    bus: bus # every generator sits on a bus
  line:
    from_bus: bus # both endpoints are buses
    to_bus: bus


parameters:
  p_max:
    dims: [generator]
  cost:
    dims: [generator]
  cap:
    dims: [line]
  neg_cap:
    dims: [line]
  load:
    dims: [snapshot, bus]

variables:
  p:
    dims: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_max
  f:
    dims: [snapshot, line]
    bounds:
      lower: neg_cap
      upper: cap

constraints:
  balance:
    dims: [snapshot, bus]
    expression: sum(p, over=generator, by=generator[bus]) + sum(f, over=line, by=line[to_bus]) - sum(f, over=line, by=line[from_bus]) == load

objective:
  sense: minimize
  expression: sum(p * cost)
