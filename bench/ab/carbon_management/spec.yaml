      Its status is held against the chosen build by big-M rows
  Link_committed:
    condition: Link_committable AND Link_active
    description: a committable unit, in a snapshot it is active in
  Link_efficiency_curve:
    condition: count(Link_efficiency_curve_p, over=breakpoint) > 0
    description: a port with a piecewise curve
  Link_maint_ext:
    condition: Link_maintainable AND Link_p_nom_extendable AND NOT (Link_committable AND Link_p_nom_mod > 0) AND Link_active
    description: a maintainable extendable unit, active in the snapshot, that is not both committable and modular
  Link_marginal_cost_as_lp:
    condition: count(Link_marginal_cost_curve AND count(Link_marginal_cost_curve_bends_down, over=breakpoint) > 0, over=Link) == 0 AND count(Link_marginal_cost_curve AND Link_committable, over=Link) == 0
    description: 'true where every `marginal_cost` curve of the component is convex and no unit with a curve is committable: then the curves are stated as segment lines, else by incremental segments'
  Link_marginal_cost_curve:
    condition: count(Link_marginal_cost_curve_p, over=breakpoint) > 0 AND Link_active_asset
