    dims: [Store, scenario]
    description: the cost read off the `capital_cost` curve where there is one, build times `capital_cost` otherwise
    cases:
      curve: {when: Store_capital_cost_curve, expression: Store_capital_cost_piecewise}
    otherwise: Store_e_nom_ext * Store_capital_cost
  Store_capex: sum(scenario_weight * Store_build_cost * Store_capital_weight)
  Store_charge_cap_pu:
    dims: [Store, scenario, snapshot]
    description: most charging through `p_store` per unit of `e_nom`; zero for a store that does not split its dispatch
    cases:
      split:
        when: Store_split_dispatch
        expression: -Store_p_min_pu / Store_max_hours
    otherwise: '0'
  Store_charge_opex: Store_operating_cost((Store_p + Store_p_store) * Store_marginal_cost_dispatch) + Store_operating_cost(Store_p_store * Store_marginal_cost_store)
  Store_closing_weight:
    dims: [Store, global_constraint, scenario, snapshot]
    description: 'what the level at the end of a period counts for in a global constraint: the period''s years at its last snapshot, nothing where each period is cyclic'
    cases:
      last:
        when: NOT Store_e_cyclic_per_period AND position(snapshot, within=snapshot_period[period]) == -1
        expression: Store_counted_years
    otherwise: '0'
  Store_counted_years:
    dims: [Store, global_constraint, scenario, snapshot]
    description: the years a global constraint weighs a snapshot with while the asset is active; zero where it does not count the snapshot
    cases:
      counted:
        when: GlobalConstraint_counts_snapshot AND Store_active
        expression: at(period_weight_years, by=snapshot_period[period])
    otherwise: '0'
  Store_discharge_floor_pu:
    dims: [Store, scenario, snapshot]
    description: 'least discharge per unit of `e_nom`: zero for a store that splits its dispatch, the most charging as negative discharge otherwise'
    cases:
      split: {when: Store_split_dispatch, expression: '0'}
    otherwise: Store_p_min_pu / Store_max_hours
  Store_e_nom_effective:
    dims: [Store, scenario]
    description: the chosen build where it is extendable, the given one otherwise
    cases:
      extendable: {when: Store_e_nom_extendable, expression: Store_e_nom_ext}
    otherwise: Store_e_nom
  Store_e_nom_rated:
    dims: [Store, scenario]
    description: >-
      the given nominal capacity, and zero where it is infinite.
      Then a limit is a row only where the per-unit value is zero
    cases:
      unrated:
        when: Store_e_nom == inf
        expression: '0'
    otherwise: Store_e_nom
  Store_injection: sum(Store_sign * Store_p, over=Store, by=Store_bus[bus])
  Store_level_before:
    dims: [Store, scenario, snapshot]
    description: 'the energy stored before a snapshot, ahead of its standing loss: the previous level, the last level where the horizon or period is cyclic, the initial level where it opens'
    cases:
      cyclic:
        when: Store_e_cyclic AND NOT Store_e_cyclic_per_period AND NOT Store_e_initial_per_period AND (position(snapshot) == 0 OR Store_opens_late)
        expression: shift(shift(Store_e, along=snapshot, offset=1, edge='wrap'), along=snapshot, offset=Store_inactive_snapshots, edge='wrap')
      opening: {when: Store_level_opens, expression: Store_e_initial}
      period_cyclic:
        when: Store_e_cyclic_per_period
        expression: shift(Store_e, along=snapshot, offset=1, edge='wrap', within=snapshot_period[period])
    otherwise: shift(Store_e, along=snapshot, offset=1)
  Store_level_carried_in:
    dims: [Store, scenario, snapshot]
    description: 'the energy stored at the start of a snapshot: the level before it less the standing loss, the initial level where it opens'
    cases:
      opening: {when: Store_level_opens, expression: Store_e_initial}
    otherwise: Store_retention * Store_level_before
  Store_opening_weight:
    dims: [Store, global_constraint, scenario, snapshot]
    description: 'what the level before a period counts for in a global constraint: the period''s years at its first snapshot, nothing where each period is cyclic'
    cases:
      first:
        when: NOT Store_e_cyclic_per_period AND position(snapshot, within=snapshot_period[period]) == 0
        expression: Store_counted_years
    otherwise: '0'
  Store_operational_limit: sum(Store_withdrawal * Store_operational_limit_weight, over=Store)
  Store_opex: Store_operating_cost(Store_running_cost) + Store_operating_cost((Store_p * Store_p) * Store_marginal_cost_quadratic)
  Store_primary_energy: sum(Store_withdrawal * Store_primary_energy_weight, over=Store)
  Store_running_cost:
    dims: [Store, scenario, snapshot]
    description: the cost read off the `marginal_cost` curve where there is one, power times `marginal_cost` otherwise
    cases:
      curve: {when: Store_marginal_cost_curve, expression: Store_marginal_cost_piecewise}
    otherwise: Store_p * Store_marginal_cost
  Store_storage_opex: sum(sum((Store_e * Store_marginal_cost_storage * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=Store), over=snapshot) + sum(sum((Store_spill * Store_spill_cost * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=Store), over=snapshot)
  Store_tech_capacity_expansion: sum(Store_e_nom_ext * Store_tech_capacity_weight, over=Store)
  Store_withdrawal:
    dims: [Store, global_constraint, scenario]
    expression: sum(Store_level_before * Store_opening_weight, over=snapshot) - sum(Store_e * Store_closing_weight, over=snapshot) + sum((Store_inflow - Store_spill) * snapshot_weightings_stores * Store_counted_years, over=snapshot)
    description: 'the energy a global constraint counts as taken out of storage, standing losses included: per counted period the level before it less the level at its end, plus inflow less spill, each weighed by the period''s years'
  Transformer_angle_sum: sum(Transformer_s * at(Transformer_cycle_weight, by=snapshot_period[period]), over=Transformer) + sum(Transformer_phase_shift_weight, over=Transformer) + sum(Transformer_phase_shift * at(Transformer_phase_shift_cycle_weight, by=snapshot_period[period]), over=Transformer)
  Transformer_build_cost:
    dims: [Transformer, scenario]
    description: the cost read off the `capital_cost` curve where there is one, build times `capital_cost` otherwise
    cases:
      curve: {when: Transformer_capital_cost_curve, expression: Transformer_capital_cost_piecewise}
    otherwise: Transformer_s_nom_ext * Transformer_capital_cost
  Transformer_capex: sum(scenario_weight * Transformer_build_cost * Transformer_capital_weight)
  Transformer_injection:
    expression: -sum(Transformer_s, over=Transformer, by=Transformer_bus0[bus]) + sum(Transformer_s, over=Transformer, by=Transformer_bus1[bus]) - (0.5 * sum(Transformer_loss, over=Transformer, by=Transformer_bus0[bus])) - (0.5 * sum(Transformer_loss, over=Transformer, by=Transformer_bus1[bus]))
    description: the flow leaves `bus0` and enters `bus1`; each end loses half the loss
  Transformer_s_monitored:
    dims: [Transformer, scenario, snapshot]
    description: the flow where the branch is active, zero otherwise
    cases:
      standing: {when: Transformer_active, expression: Transformer_s}
    otherwise: '0'
  Transformer_s_nom_rated:
    dims: [Transformer, scenario]
    description: >-
      the given nominal capacity, and zero where it is infinite.
      Then a limit is a row only where the per-unit value is zero
    cases:
      unrated:
        when: Transformer_s_nom == inf
        expression: '0'
    otherwise: Transformer_s_nom
  energy_limit_weight:
    dims: [snapshot]
    expression: snapshot_weightings_generators * at(period_weight_years, by=snapshot_period[period])
    description: what one unit of power counts for in an `e_sum` row, hours times the period's years
  operational_limit:
    dims: [global_constraint, scenario]
    expression: Generator_operational_limit + StorageUnit_operational_limit + Store_operational_limit
    description: the energy generated, plus the energy taken out of storage
  primary_energy:
    dims: [global_constraint, scenario]
    expression: Generator_primary_energy + StorageUnit_primary_energy + Store_primary_energy
    description: the primary energy of generation, plus that of the energy taken out of storage
  risk_weighted_opex: (1 - CVaR_omega) * sum(scenario_weight * scenario_opex, over=scenario) + CVaR_omega * CVaR
  scenario_opex:
    dims: [scenario]
    expression: Generator_opex + Generator_commitment_opex + Link_opex + Link_commitment_opex + Process_opex + Process_commitment_opex + StorageUnit_opex + StorageUnit_storage_opex + Store_opex + Store_storage_opex + Store_charge_opex
    description: the operating cost of a scenario, weighted by hours and period
  tech_capacity_expansion:
    dims: [global_constraint]
    expression: Generator_tech_capacity_expansion + Line_tech_capacity_expansion + Link_tech_capacity_expansion + Process_tech_capacity_expansion + StorageUnit_tech_capacity_expansion + Store_tech_capacity_expansion
    description: the chosen build of the row's carrier-and-bus set
  total_cost:
    dims: []
    expression: Generator_capex + Link_capex + StorageUnit_capex + Store_capex + Line_capex + Process_capex + Transformer_capex + risk_weighted_opex
    description: capital cost of every component, plus the risk-weighted operating cost
  transmission_expansion_cost:
    dims: [global_constraint, scenario]
    expression: Line_transmission_expansion_cost + Link_transmission_expansion_cost
    description: capital cost times chosen build of the row's branches
  transmission_volume_expansion:
    dims: [global_constraint, scenario]
    expression: Line_transmission_volume_expansion + Link_transmission_volume_expansion
    description: length times chosen build of the row's branches
objective: {sense: minimize, expression: total_cost}
constraints:
  Bus_nodal_balance:
    dims: [bus, scenario, snapshot]
    where: Bus_attached
    expression: Bus_injection == 0
    description: what enters a bus equals what leaves it
  CVaR_def:
    dims: []
    where: CVaR_omega
    expression: CVaR_theta + 1 / (1 - CVaR_alpha) * sum(scenario_weight * CVaR_a, over=scenario) <= CVaR
    description: the CVaR is at least the value at risk plus the expected excess over the tail probability
  CVaR_excess:
    dims: [scenario]
    where: CVaR_omega
    expression: CVaR_a - scenario_opex + CVaR_theta >= 0
    description: a scenario's operating cost beyond the value at risk is its excess
  Carrier_growth_limit:
    dims: [carrier, period]
    where: Carrier_max_growth
    expression: Carrier_additions - shift(Carrier_additions, along=period, offset=1, edge=0) * Carrier_relative_growth <= Carrier_max_growth
    description: what a carrier adds in a period is at most its allowance plus a share of what it added in the period before
  FlowBased_balance:
    dims: [flow_based_domain, scenario, snapshot]
    expression: sum(FlowBased_net_position, over=bus, by=Bus_flow_based_domain[flow_based_domain]) == 0
    description: the net positions of each domain's zones sum to zero
  Generator_com_down_time:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND Generator_min_down_time > 0
    expression: sum_back(Generator_shut_down, along=snapshot, window=Generator_min_down_time) + Generator_down_time_brought_in <= Generator_modules - Generator_status
    description: a module stopped within the minimum down time is still off
  Generator_com_ext_p_lower:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext
    expression: Generator_p >= Generator_p_min_pu * (Generator_p_nom_ext - Generator_maintenance_pu * Generator_maintenance_capacity) + Generator_big_m * Generator_status - Generator_big_m
    description: a committed extendable unit runs at least at its minimum of the chosen build while on
  Generator_com_ext_p_lower_nonneg:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext AND Generator_p_min_pu_nonneg
    expression: Generator_p >= 0
    description: the power of a committed extendable unit is not negative where its `p_min_pu` never is
  Generator_com_ext_p_upper_big_m:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext
    expression: Generator_p <= Generator_big_m * Generator_status
    description: a committed extendable unit does not run while off
  Generator_com_ext_p_upper_cap:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext
    expression: Generator_p <= Generator_p_max_pu * (Generator_p_nom_ext - Generator_maintenance_pu * Generator_maintenance_capacity)
    description: a committed extendable unit runs at most at its maximum of the chosen build
  Generator_com_mod_p_lower:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND Generator_p_nom_mod > 0
    expression: Generator_p >= Generator_p_min_pu * Generator_p_nom_mod * (Generator_status - Generator_maintenance_pu * Generator_maintenance_status)
    description: a committed modular unit runs at least at the minimum of its modules on
  Generator_com_mod_p_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND Generator_p_nom_mod > 0
    expression: Generator_p <= Generator_p_max_pu * Generator_p_nom_mod * (Generator_status - Generator_maintenance_pu * Generator_maintenance_status)
    description: a committed modular unit runs at most at the maximum of its modules on
  Generator_com_p_lower:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND NOT Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)
    expression: Generator_p >= Generator_p_min_pu * Generator_p_nom * (Generator_status - Generator_maintenance_pu * Generator_maintenance_status)
    description: a committed unit runs at least at its minimum while on
  Generator_com_p_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND NOT Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)
    expression: Generator_p <= Generator_p_max_pu * Generator_p_nom * (Generator_status - Generator_maintenance_pu * Generator_maintenance_status)
    description: a committed unit runs at most at its maximum while on, and not at all while off
  Generator_com_transition_shut_down:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed
    expression: Generator_shut_down >= Generator_previous_status - Generator_status
    description: a module that turns off stops
  Generator_com_transition_start_up:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed
    expression: Generator_start_up >= Generator_status - Generator_previous_status
    description: a module that turns on starts
  Generator_com_up_time:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND Generator_min_up_time > 0
    expression: sum_back(Generator_start_up, along=snapshot, window=Generator_min_up_time) + Generator_up_time_brought_in <= Generator_status
    description: a module started within the minimum up time is still on
  Generator_e_sum_max:
    dims: [Generator, scenario]
    where: Generator_e_sum_max AND count(Generator_active, over=snapshot) > 0
    expression: sum(Generator_p * energy_limit_weight, over=snapshot) <= Generator_e_sum_max
    description: the energy over the horizon, each period weighted by its years, is at most the cap
  Generator_e_sum_min:
    dims: [Generator, scenario]
    where: Generator_e_sum_min AND count(Generator_active, over=snapshot) > 0
    expression: sum(Generator_p * energy_limit_weight, over=snapshot) >= Generator_e_sum_min
    description: the energy over the horizon, each period weighted by its years, is at least the floor
  Generator_ext_p_lower:
    dims: [Generator, scenario, snapshot]
    where: Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p >= Generator_p_min_pu * (Generator_p_nom_ext - Generator_maintenance_pu * Generator_maintenance_capacity)
    description: an extendable unit that is not committable runs at least at its minimum of the chosen build
  Generator_ext_p_nom_lower:
    dims: [Generator]
    where: Generator_p_nom_extendable AND Generator_active_asset
    expression: Generator_p_nom_ext >= Generator_p_nom_min
    description: the chosen build is at least the floor
  Generator_ext_p_nom_upper:
    dims: [Generator]
    where: Generator_p_nom_extendable AND Generator_active_asset AND Generator_p_nom_max
    expression: Generator_p_nom_ext <= Generator_p_nom_max
    description: the chosen build is at most the cap; an infinite cap means no row
  Generator_ext_p_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_p_nom_extendable AND not Generator_committable AND Generator_active
    expression: Generator_p <= Generator_p_max_pu * (Generator_p_nom_ext - Generator_maintenance_pu * Generator_maintenance_capacity)
    description: an extendable unit that is not committable runs at most at its maximum of the chosen build
  Generator_fix_p_lower:
    dims: [Generator, scenario, snapshot]
    where: not Generator_p_nom_extendable AND not Generator_committable AND Generator_active AND (Generator_p_nom < inf OR Generator_p_min_pu == 0)
    expression: Generator_p >= Generator_p_min_pu * Generator_p_nom_rated * (1 - Generator_maintenance_pu * Generator_maintenance)
    description: a fixed unit that is not committable runs at least at its minimum
  Generator_fix_p_upper:
    dims: [Generator, scenario, snapshot]
    where: not Generator_p_nom_extendable AND not Generator_committable AND Generator_active AND (Generator_p_nom < inf OR Generator_p_max_pu == 0)
    expression: Generator_p <= Generator_p_max_pu * Generator_p_nom_rated * (1 - Generator_maintenance_pu * Generator_maintenance)
    description: a fixed unit that is not committable runs at most at its maximum
  Generator_maint_event_count:
    dims: [Generator, scenario]
    where: Generator_maintainable
    expression: sum(Generator_maintenance_start, over=snapshot) == Generator_maintenance_events
    description: the unit has its number of events within the horizon
  Generator_maint_modstatus_lb:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND Generator_p_nom_mod > 0
    expression: Generator_maintenance_status >= Generator_status - Generator_maintenance_modules * (1 - Generator_maintenance)
    description: in maintenance, every module on is on in maintenance
  Generator_maint_modstatus_le_maint:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND Generator_p_nom_mod > 0
    expression: Generator_maintenance_status <= Generator_maintenance_modules * Generator_maintenance
    description: out of maintenance, no module is on in maintenance
  Generator_maint_modstatus_le_status:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND Generator_p_nom_mod > 0
    expression: Generator_maintenance_status <= Generator_status
    description: the modules on in maintenance are at most the modules on
  Generator_maint_start_horizon:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_active AND Generator_maintenance_start_blocked
    expression: Generator_maintenance_start == 0
    description: no event starts where it cannot run its whole duration
  Generator_maint_status_lb:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND NOT Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)
    expression: Generator_maintenance_status >= Generator_status + Generator_maintenance - 1
    description: on and in maintenance, the status in maintenance is one
  Generator_maint_status_le_maint:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND NOT Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)
    expression: Generator_maintenance_status <= Generator_maintenance
    description: out of maintenance, the status in maintenance is zero
  Generator_maint_status_le_status:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_committed AND NOT Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)
    expression: Generator_maintenance_status <= Generator_status
    description: the status in maintenance is at most the status
  Generator_maint_window:
    dims: [Generator, scenario, snapshot]
    where: Generator_maintainable AND Generator_active
    expression: Generator_maintenance == sum(Generator_maintenance_start, over=start, by=Generator_maintenance_cover[covered])
    description: the unit is in maintenance exactly where an event covers the snapshot; events do not overlap
  Generator_maintcap_lower_nommax:
    dims: [Generator, scenario, snapshot]
    where: Generator_maint_ext
    expression: Generator_maintenance_capacity >= Generator_p_nom_ext - Generator_p_nom_max * (1 - Generator_maintenance)
    description: in maintenance, the whole chosen build is taken off
  Generator_maintcap_lower_nommin:
    dims: [Generator, scenario, snapshot]
    where: Generator_maint_ext AND Generator_p_nom_min > 0
    expression: Generator_maintenance_capacity >= Generator_p_nom_min * Generator_maintenance
    description: in maintenance, at least the floor of the build is taken off
  Generator_maintcap_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_maint_ext
    expression: Generator_maintenance_capacity <= Generator_p_nom_ext - Generator_p_nom_min * (1 - Generator_maintenance)
    description: the build in maintenance is at most the chosen build, and at most the build less its floor out of maintenance
  Generator_maintcap_upper_nommax:
    dims: [Generator, scenario, snapshot]
    where: Generator_maint_ext
    expression: Generator_maintenance_capacity <= Generator_p_nom_max * Generator_maintenance
    description: out of maintenance, no build is taken off
  Generator_p_nom_modularity:
    dims: [Generator]
    where: Generator_p_nom_extendable AND Generator_p_nom_mod > 0 AND Generator_active_asset
    expression: Generator_p_nom_ext == Generator_p_nom_mod * Generator_n_mod
    description: the chosen build is a whole number of modules
  Generator_p_nom_set:
    dims: [Generator]
    where: Generator_p_nom_extendable AND Generator_active_asset AND Generator_p_nom_set
    expression: Generator_p_nom_ext == Generator_p_nom_set
    description: the chosen build equals the given one
  Generator_p_ramp_limit_down:
    dims: [Generator, scenario, snapshot]
    where: (Generator_ramp_limit_down OR Generator_ramp_limit_shut_down) AND NOT (Generator_committable AND Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)) AND Generator_ramps_from_previous AND Generator_active
    expression: Generator_previous_p - Generator_p <= Generator_ramp_down_allowance
    description: >-
      the power falls at most by the ramp allowance.
      A committed extendable unit that is not modular has the big-M rows instead
  Generator_p_ramp_limit_down_run_big_m:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext AND (Generator_ramp_limit_down OR Generator_ramp_limit_shut_down) AND Generator_ramps_from_previous
    expression: Generator_p - Generator_previous_p >= -Generator_ramp_down_rate * Generator_p_nom_ext - Generator_big_m + Generator_big_m * Generator_status
    description: a running committed extendable unit falls at most by its ramp limit of the chosen build
  Generator_p_ramp_limit_down_shut_big_m:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext AND (Generator_ramp_limit_down OR Generator_ramp_limit_shut_down) AND Generator_ramps_from_previous
    expression: Generator_previous_p - Generator_p <= Generator_shut_down_rate * Generator_p_nom_ext + Generator_big_m - Generator_big_m * Generator_shut_down
    description: a stopping committed extendable unit falls at most by its shut-down ramp of the chosen build
  Generator_p_ramp_limit_up:
    dims: [Generator, scenario, snapshot]
    where: (Generator_ramp_limit_up OR Generator_ramp_limit_start_up) AND NOT (Generator_committable AND Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0)) AND Generator_ramps_from_previous AND Generator_active
    expression: Generator_p - Generator_previous_p <= Generator_ramp_up_allowance
    description: >-
      the power rises at most by the ramp allowance.
      A committed extendable unit that is not modular has the big-M rows instead
  Generator_p_ramp_limit_up_run_big_m:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext AND (Generator_ramp_limit_up OR Generator_ramp_limit_start_up) AND Generator_ramps_from_previous
    expression: Generator_p - Generator_previous_p <= Generator_ramp_up_rate * Generator_p_nom_ext + Generator_big_m - Generator_big_m * Generator_previous_status
    description: a running committed extendable unit rises at most by its ramp limit of the chosen build
  Generator_p_ramp_limit_up_start_big_m:
    dims: [Generator, scenario, snapshot]
    where: Generator_com_ext AND (Generator_ramp_limit_up OR Generator_ramp_limit_start_up) AND Generator_ramps_from_previous
    expression: Generator_p - Generator_previous_p <= Generator_start_up_rate * Generator_p_nom_ext + Generator_big_m - Generator_big_m * Generator_start_up
    description: a starting committed extendable unit rises at most by its start-up ramp of the chosen build
  Generator_p_set:
    dims: [Generator, scenario, snapshot]
    where: Generator_p_set AND Generator_active
    expression: Generator_p == Generator_p_set
    description: the power follows the given schedule
  Generator_shut_down_p_fixed_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND NOT (Generator_p_nom_extendable AND Generator_p_nom_mod > 0)
    expression: Generator_shut_down <= Generator_modules_installed
    description: the stops are at most the modules installed
  Generator_shut_down_p_nom_variable_upper:
    dims: [Generator, scenario, snapshot]
    where: Generator_committed AND Generator_p_nom_extendable AND Generator_p_nom_mod > 0
