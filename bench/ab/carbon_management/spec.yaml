macros:
  Generator_operating_cost:
    args: [cost]
    template: sum(sum((cost * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=Generator), over=snapshot)
    description: a cost per snapshot, weighted by the snapshot's hours and its period, summed
  Link_operating_cost:
    args: [cost]
    template: sum(sum((cost * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=Link), over=snapshot)
