expressions:
  Bus_injection:
    dims: [bus, scenario, snapshot]
    expression: FlowBased_injection + Generator_injection + Line_injection + Link_injection + Load_injection + Process_injection + StorageUnit_injection + Store_injection + Transformer_injection
    description: what every component puts into a bus, less what it takes out
  Carrier_additions:
    dims: [carrier, period]
    expression: Generator_additions + Line_additions + Link_additions + Process_additions + StorageUnit_additions + Store_additions
    description: the capacity a carrier adds in a period; a transformer has no carrier
  Carrier_relative_growth:
    dims: [carrier]
    description: '`max_relative_growth`, clipped at zero'
    cases:
      positive:
        when: Carrier_max_relative_growth > 0
        expression: Carrier_max_relative_growth
    otherwise: '0'
  Cycle_angle_sum:
    dims: [cycle, scenario, snapshot]
    expression: Line_angle_sum + Transformer_angle_sum
    description: the voltage angle differences around a cycle, phase shifts included
  FlowBased_injection:
    dims: [bus, scenario, snapshot]
    expression: -FlowBased_net_position
    description: a zone bus's net position leaves the bus
  Generator_additions: sum(Generator_p_nom_ext * Generator_first_active, over=Generator, by=Generator_carrier[carrier])
  Generator_build_cost:
    dims: [Generator, scenario]
    description: the cost read off the `capital_cost` curve where there is one, build times `capital_cost` otherwise
    cases:
      curve: {when: Generator_capital_cost_curve, expression: Generator_capital_cost_piecewise}
    otherwise: Generator_p_nom_ext * Generator_capital_cost
  Generator_capex: sum(scenario_weight * Generator_build_cost * Generator_capital_weight)
  Generator_commitment_opex: sum(sum((Generator_status * Generator_stand_by_cost * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=Generator), over=snapshot) + sum(sum((Generator_start_up * Generator_start_up_cost) * at(period_weight_objective, by=snapshot_period[period]), over=Generator), over=snapshot) + sum(sum((Generator_shut_down * Generator_shut_down_cost) * at(period_weight_objective, by=snapshot_period[period]), over=Generator), over=snapshot)
  Generator_injection: sum(Generator_sign * Generator_p, over=Generator, by=Generator_bus[bus])
  Generator_maintenance_modules:
    dims: [Generator, scenario]
    description: 'the most modules that can be on in maintenance: the build cap in modules where extendable, the modules installed where fixed'
    cases:
      extendable:
        when: Generator_p_nom_extendable
        expression: Generator_p_nom_max / Generator_p_nom_mod
    otherwise: Generator_modules_installed
  Generator_modules:
    dims: [Generator, scenario]
    description: 'how many modules the status counts: the chosen number for an extendable modular build, the installed number otherwise'
    cases:
      chosen:
        when: Generator_p_nom_extendable AND Generator_p_nom_mod > 0
        expression: Generator_n_mod
    otherwise: Generator_modules_installed
  Generator_operational_limit: sum(sum((Generator_p * GlobalConstraint_energy_weight) * Generator_operational_limit_weight, over=snapshot), over=Generator)
  Generator_opex: Generator_operating_cost(Generator_running_cost) + Generator_operating_cost((Generator_p * Generator_p) * Generator_marginal_cost_quadratic)
  Generator_p_carried_over:
    dims: [Generator, scenario, snapshot]
    description: '`p_init` at the first snapshot, the previous power after it'
    cases:
      opening:
        when: position(snapshot) == 0
        expression: Generator_p_init
    otherwise: shift(Generator_p, along=snapshot, offset=1)
  Generator_p_nom_committed:
    dims: [Generator, scenario]
    description: the capacity one status counts for in the ramp rows; one module, or the whole build
    cases:
      modular_build:
        when: Generator_p_nom_mod > 0
        expression: Generator_p_nom_mod
    otherwise: Generator_p_nom
  Generator_p_nom_effective:
    dims: [Generator, scenario]
    description: the chosen build where it is extendable, the given one otherwise
    cases:
      extendable: {when: Generator_p_nom_extendable, expression: Generator_p_nom_ext}
    otherwise: Generator_p_nom
  Generator_p_nom_rated:
    dims: [Generator, scenario]
    description: >-
      the given nominal capacity, and zero where it is infinite.
      Then a limit is a row only where the per-unit value is zero
    cases:
      unrated:
        when: Generator_p_nom == inf
        expression: '0'
    otherwise: Generator_p_nom
  Generator_previous_p:
    dims: [Generator, scenario, snapshot]
    description: >-
      the power a unit carries into a snapshot.
      It is zero at the first snapshot of a unit that becomes active later
    cases:
      opening_late:
        when: position(snapshot) > 0 AND NOT shift(Generator_active, along=snapshot, offset=1)
        expression: '0'
    otherwise: Generator_p_carried_over
  Generator_previous_status:
    dims: [Generator, scenario, snapshot]
    description: >-
      the status a unit carries into a snapshot.
      It is off at the first snapshot of a unit that becomes active later
    cases:
      opening_late:
        when: position(snapshot) > 0 AND NOT shift(Generator_active, along=snapshot, offset=1)
        expression: '0'
    otherwise: Generator_status_carried_over
  Generator_primary_energy: sum(sum((Generator_primary_input * GlobalConstraint_energy_weight) * Generator_primary_energy_weight, over=snapshot), over=Generator)
  Generator_primary_input:
    dims: [Generator, scenario, snapshot]
    description: the primary energy read off the `efficiency` curve where there is one, the output otherwise
    cases:
      curve: {when: Generator_efficiency_curve, expression: Generator_p_primary_piecewise}
    otherwise: Generator_p
  Generator_ramp_down_allowance:
    dims: [Generator, scenario, snapshot]
    description: 'how far the power may fall between two snapshots: the ramp limit of the modules that stay on, plus the shut-down ramp of those that stop'
    cases:
      committed:
        when: Generator_committable
        expression: Generator_ramp_down_rate * Generator_p_nom_committed * Generator_status + Generator_shut_down_rate * Generator_p_nom_committed * (Generator_ramp_previous_status - Generator_status)
    otherwise: Generator_ramp_down_rate * Generator_p_nom_effective
  Generator_ramp_down_rate:
    dims: [Generator, scenario, snapshot]
    description: '`ramp_limit_down`, or one (the full build) where it has none'
    cases:
      given: {when: Generator_ramp_limit_down, expression: Generator_ramp_limit_down}
    otherwise: '1'
  Generator_ramp_previous_status:
    dims: [Generator, scenario, snapshot]
    description: >-
      the status the ramp rows carry into a snapshot.
      A fixed modular unit that came in on has all its modules on at the first snapshot
    cases:
      opening_modules:
        when: position(snapshot) == 0 AND NOT Generator_p_nom_extendable AND Generator_p_nom_mod > 0
        expression: Generator_status_initial * Generator_modules_installed
    otherwise: Generator_previous_status
  Generator_ramp_up_allowance:
    dims: [Generator, scenario, snapshot]
    description: 'how far the power may rise between two snapshots: the ramp limit of the modules that stay on, plus the start-up ramp of those that start'
    cases:
      committed:
        when: Generator_committable
        expression: Generator_ramp_up_rate * Generator_p_nom_committed * Generator_ramp_previous_status + Generator_start_up_rate * Generator_p_nom_committed * (Generator_status - Generator_ramp_previous_status)
    otherwise: Generator_ramp_up_rate * Generator_p_nom_effective
  Generator_ramp_up_rate:
    dims: [Generator, scenario, snapshot]
    description: '`ramp_limit_up`, or one (the full build) where it has none'
    cases:
      given: {when: Generator_ramp_limit_up, expression: Generator_ramp_limit_up}
    otherwise: '1'
  Generator_running_cost:
    dims: [Generator, scenario, snapshot]
    description: the cost read off the `marginal_cost` curve where there is one, power times `marginal_cost` otherwise
    cases:
      curve: {when: Generator_marginal_cost_curve, expression: Generator_marginal_cost_piecewise}
    otherwise: Generator_p * Generator_marginal_cost
  Generator_shut_down_rate:
    dims: [Generator, scenario]
    description: '`ramp_limit_shut_down`, or one (the full build) where it has none'
    cases:
      given: {when: Generator_ramp_limit_shut_down, expression: Generator_ramp_limit_shut_down}
    otherwise: '1'
  Generator_start_up_rate:
    dims: [Generator, scenario]
    description: '`ramp_limit_start_up`, or one (the full build) where it has none'
    cases:
      given: {when: Generator_ramp_limit_start_up, expression: Generator_ramp_limit_start_up}
    otherwise: '1'
  Generator_status_carried_over:
