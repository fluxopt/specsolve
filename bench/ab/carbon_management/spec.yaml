  Process_marginal_cost_curve_bends_down:
    condition: Process_marginal_cost_curve_p AND shift(Process_marginal_cost_curve_p, along=breakpoint, offset=1) AND shift(Process_marginal_cost_curve_p, along=breakpoint, offset=-1) AND (Process_marginal_cost_curve_cost - shift(Process_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Process_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - Process_marginal_cost_curve_p) > (shift(Process_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Process_marginal_cost_curve_cost) * (Process_marginal_cost_curve_p - shift(Process_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))
