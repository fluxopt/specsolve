    expression: Store_p_store >= 0
    description: an extendable asset stores no negative power
  Store_ext_p_store_upper:
    dims: [Store, scenario, snapshot]
    where: Store_e_nom_extendable AND Store_active AND (NOT Store_split_dispatch OR Store_max_hours)
    expression: Store_p_store <= Store_charge_cap_pu * Store_e_nom_ext
    description: an extendable store charges through `p_store` at most its power rating of the chosen build where it splits its dispatch, not at all otherwise
  Store_ext_p_upper:
    dims: [Store, scenario, snapshot]
    where: Store_e_nom_extendable AND Store_active AND Store_max_hours
    expression: Store_p + Store_p_store <= Store_p_max_pu / Store_max_hours * Store_e_nom_ext
    description: >-
      an extendable store discharges at most its power rating of the chosen build.
      No row without `max_hours`
  Store_fix_e_lower:
    dims: [Store, scenario, snapshot]
    where: not Store_e_nom_extendable AND Store_active AND (Store_e_nom < inf OR Store_e_min_pu == 0)
    expression: Store_e >= Store_e_min_pu * Store_e_nom_rated
    description: a fixed store holds at least its floor
  Store_fix_e_upper:
    dims: [Store, scenario, snapshot]
    where: not Store_e_nom_extendable AND Store_active AND (Store_e_nom < inf OR Store_e_max_pu == 0)
    expression: Store_e <= Store_e_max_pu * Store_e_nom_rated
    description: a fixed store holds at most its nominal capacity
  Store_fix_p_lower:
    dims: [Store, scenario, snapshot]
    where: NOT Store_e_nom_extendable AND Store_active AND (Store_split_dispatch OR Store_max_hours) AND (Store_e_nom < inf OR Store_split_dispatch OR Store_p_min_pu == 0)
    expression: Store_p + Store_p_store >= Store_discharge_floor_pu * Store_e_nom_rated
    description: >-
      a fixed store discharges at least its floor.
      No row for a store that does not split its dispatch and has no `max_hours`
  Store_fix_p_store_lower:
    dims: [Store, scenario, snapshot]
    where: NOT Store_e_nom_extendable AND Store_active
    expression: Store_p_store >= 0
    description: a fixed asset stores no negative power
  Store_fix_p_store_upper:
    dims: [Store, scenario, snapshot]
    where: NOT Store_e_nom_extendable AND Store_active AND (NOT Store_split_dispatch OR Store_max_hours) AND (Store_e_nom < inf OR NOT Store_split_dispatch OR Store_p_min_pu == 0)
    expression: Store_p_store <= Store_charge_cap_pu * Store_e_nom_rated
    description: a fixed store charges through `p_store` at most its power rating where it splits its dispatch, not at all otherwise
  Store_fix_p_upper:
    dims: [Store, scenario, snapshot]
    where: NOT Store_e_nom_extendable AND Store_active AND Store_max_hours AND (Store_e_nom < inf OR Store_p_max_pu == 0)
    expression: Store_p + Store_p_store <= Store_p_max_pu / Store_max_hours * Store_e_nom_rated
    description: >-
      a fixed store discharges at most its power rating.
      No row without `max_hours`
  Store_p_set:
    dims: [Store, scenario, snapshot]
    where: Store_p_set AND Store_active
    expression: Store_p == Store_p_set
    description: the power follows the given schedule
  Transformer_ext_s_lower:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_s_nom_extendable AND Transformer_active
    expression: Transformer_s - Transformer_loss >= -Transformer_s_max_pu * Transformer_s_nom_ext
    description: an extendable branch carries at least the negative of its rating of the chosen build, loss included
  Transformer_ext_s_lower_security:
    dims: [Transformer, outage, scenario, snapshot]
    where: Transformer_s_nom_extendable AND at(Transformer_BODF, by=snapshot_period[period]) AND Transformer_active
    expression: Transformer_s_monitored + at(Transformer_BODF, by=snapshot_period[period]) * Outage_s >= -Transformer_s_max_pu * Transformer_s_nom_ext
    description: after any one outage, an extendable branch carries at least the negative of its rating of the chosen build
  Transformer_ext_s_nom_lower:
    dims: [Transformer]
    where: Transformer_s_nom_extendable AND Transformer_active_asset
    expression: Transformer_s_nom_ext >= Transformer_s_nom_min
    description: the chosen build is at least the floor
  Transformer_ext_s_nom_upper:
    dims: [Transformer]
    where: Transformer_s_nom_extendable AND Transformer_active_asset AND Transformer_s_nom_max
    expression: Transformer_s_nom_ext <= Transformer_s_nom_max
    description: the chosen build is at most the cap; an infinite cap means no row
  Transformer_ext_s_upper:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_s_nom_extendable AND Transformer_active
    expression: Transformer_s + Transformer_loss <= Transformer_s_max_pu * Transformer_s_nom_ext
    description: an extendable branch carries at most its rating of the chosen build, loss included
  Transformer_ext_s_upper_security:
    dims: [Transformer, outage, scenario, snapshot]
    where: Transformer_s_nom_extendable AND at(Transformer_BODF, by=snapshot_period[period]) AND Transformer_active
    expression: Transformer_s_monitored + at(Transformer_BODF, by=snapshot_period[period]) * Outage_s <= Transformer_s_max_pu * Transformer_s_nom_ext
    description: after any one outage, an extendable branch carries at most its rating of the chosen build
  Transformer_fix_s_lower:
    dims: [Transformer, scenario, snapshot]
    where: not Transformer_s_nom_extendable AND Transformer_active AND (Transformer_s_nom < inf OR Transformer_s_max_pu == 0)
    expression: Transformer_s - Transformer_loss >= -Transformer_s_max_pu * Transformer_s_nom_rated
    description: a fixed branch carries at least the negative of its rating, loss included
  Transformer_fix_s_lower_security:
    dims: [Transformer, outage, scenario, snapshot]
    where: not Transformer_s_nom_extendable AND at(Transformer_BODF, by=snapshot_period[period]) AND Transformer_active
    expression: Transformer_s_monitored + at(Transformer_BODF, by=snapshot_period[period]) * Outage_s >= -Transformer_s_max_pu * Transformer_s_nom
    description: after any one outage, a fixed branch carries at least the negative of its rating; its flow includes its share of the outaged flow
  Transformer_fix_s_upper:
    dims: [Transformer, scenario, snapshot]
    where: not Transformer_s_nom_extendable AND Transformer_active AND (Transformer_s_nom < inf OR Transformer_s_max_pu == 0)
    expression: Transformer_s + Transformer_loss <= Transformer_s_max_pu * Transformer_s_nom_rated
    description: a fixed branch carries at most its rating, loss included
  Transformer_fix_s_upper_security:
    dims: [Transformer, outage, scenario, snapshot]
    where: not Transformer_s_nom_extendable AND at(Transformer_BODF, by=snapshot_period[period]) AND Transformer_active
    expression: Transformer_s_monitored + at(Transformer_BODF, by=snapshot_period[period]) * Outage_s <= Transformer_s_max_pu * Transformer_s_nom
    description: after any one outage, a fixed branch carries at most its rating; its flow includes its share of the outaged flow
  Transformer_loss_tangents_forward:
    dims: [Transformer, scenario, segment, snapshot]
    where: Transformer_lossy
    expression: Transformer_loss + Transformer_loss_slope * Transformer_s >= Transformer_loss_offset
    description: the loss lies above each cut of the loss curve, mirrored for negative flow
  Transformer_loss_tangents_reverse:
    dims: [Transformer, scenario, segment, snapshot]
    where: Transformer_lossy
    expression: Transformer_loss - Transformer_loss_slope * Transformer_s >= Transformer_loss_offset
    description: the loss lies above each cut of the loss curve, for positive flow
  Transformer_loss_upper:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_lossy
    expression: Transformer_loss <= Transformer_loss_max
    description: the loss is at most the loss at full rating
  Transformer_s_nom_modularity:
    dims: [Transformer]
    where: Transformer_s_nom_extendable AND Transformer_s_nom_mod > 0 AND Transformer_active_asset
    expression: Transformer_s_nom_ext == Transformer_s_nom_mod * Transformer_n_mod
    description: the chosen build is a whole number of modules
  Transformer_s_nom_set:
    dims: [Transformer]
    where: Transformer_s_nom_extendable AND Transformer_active_asset AND Transformer_s_nom_set
    expression: Transformer_s_nom_ext == Transformer_s_nom_set
    description: the chosen build equals the given one
  Transformer_s_set:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_s_set AND Transformer_active
    expression: Transformer_s == Transformer_s_set
    description: the flow follows the given schedule
  Transformer_v_ang_lower:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_v_ang_max AND NOT Transformer_phase_shift_varying AND Transformer_active
    expression: Transformer_s >= -(Transformer_v_ang_max + Transformer_phase_shift_fixed) * deg2rad / Transformer_x_pu_eff
    description: a fixed transformer carries at least the flow of the most negative angle difference, net of its shift
  Transformer_v_ang_upper:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_v_ang_max AND NOT Transformer_phase_shift_varying AND Transformer_active
    expression: Transformer_s <= (Transformer_v_ang_max - Transformer_phase_shift_fixed) * deg2rad / Transformer_x_pu_eff
    description: a fixed transformer carries at most the flow of the largest angle difference, net of its shift
  Transformer_v_ang_var_lower:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_v_ang_max AND Transformer_phase_shift_varying AND Transformer_active
    expression: Transformer_s + Transformer_phase_shift * deg2rad / Transformer_x_pu_eff >= -Transformer_v_ang_max * deg2rad / Transformer_x_pu_eff
    description: the same lower bound for a varying transformer, its shift a decision
  Transformer_v_ang_var_upper:
    dims: [Transformer, scenario, snapshot]
    where: Transformer_v_ang_max AND Transformer_phase_shift_varying AND Transformer_active
    expression: Transformer_s + Transformer_phase_shift * deg2rad / Transformer_x_pu_eff <= Transformer_v_ang_max * deg2rad / Transformer_x_pu_eff
    description: the same upper bound for a varying transformer, its shift a decision
