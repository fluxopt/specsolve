version: 0
description: >-
  The optimisation problem of `n.optimize()`, with its multi-period and its stochastic variants.
  Capacity is chosen once, before the future is known, and paid in each investment `period` the asset is active in.
  Dispatch is chosen per `scenario`.
  The objective is the expected cost over the scenarios; with a risk preference, a share of the operating cost is priced at its conditional value at risk (CVaR).
  A plain run has one scenario, one period, unit weights and no outage.
dimensions:
  Generator:
    description: generators, each on one bus
  Line:
    description: passive branches, their flow set by impedance
  Link:
    description: controllable branches, each from `bus0` to the buses its ports deliver to
  Load:
    description: demands, each on one bus
  Process:
    description: converters whose ports each draw or deliver at their own rate of `p`
  StorageUnit:
    description: storage units with a power capacity and `max_hours` of energy, each on one bus
  Store:
    description: energy stores, each on one bus
  Transformer:
    description: passive branches with a tap ratio and a fixed or optimised phase shift
  breakpoint:
    dtype: int
    ordered: true
    description: the corners of a piecewise-linear curve, in order; curves may differ in length
  bus:
    description: network nodes
  carrier:
    description: energy carriers
  cycle:
    description: >-
      the independent cycles of the passive network, per period.
      A label is a position in the period's cycle basis, so it may be another cycle in another period
  flow_based_domain:
    description: the flow-based domains, each with a zero-sum balance of net positions
  global_constraint:
    description: the `GlobalConstraint` rows
  outage:
    description: the lines and transformers a security-constrained run takes out one at a time
  period:
    dtype: int
    ordered: true
    description: investment periods
  port:
    dtype: int
    description: the port numbers of the multiport units, `k` of `bus<k>`; a unit uses the numbers whose bus it names
  scenario:
    description: the futures dispatch is chosen in, each with a weight
  segment:
    dtype: int
    description: the cuts a passive branch's loss curve lies above, tangents or secants
  snapshot:
    dtype: str
    ordered: true
    description: dispatch periods
relations:
  Bus_flow_based_domain:
    key: bus
    values: flow_based_domain
    missing: absent
    description: the flow-based domain a zone bus belongs to
  Generator_bus:
    key: Generator
    values: bus
    description: the bus the unit connects to
  Generator_carrier:
    key: Generator
    values: carrier
    description: the asset's carrier
  Generator_maintenance_cover:
    key: {Generator: Generator, covered: snapshot, scenario: scenario, start: snapshot}
    missing: absent
    description: the snapshots an event covers, by the snapshot it starts in
  Line_bus0:
    key: Line
    values: bus
    description: the bus the flow is measured at
  Line_bus1:
    key: Line
    values: bus
    description: the bus at the other end
  Line_carrier:
    key: Line
    values: carrier
    description: the asset's carrier
  Link_bus0:
    key: Link
    values: bus
    description: the bus `p` is drawn from
  Link_carrier:
    key: Link
    values: carrier
    description: the asset's carrier
  Link_maintenance_cover:
    key: {Link: Link, covered: snapshot, scenario: scenario, start: snapshot}
    missing: absent
    description: the snapshots an event covers, by the snapshot it starts in
  Link_port_Link:
    key: [Link, port]
    values: {owner: Link}
    missing: absent
    description: the ports each unit has, each to the unit itself
  Link_port_bus:
    key: [Link, port]
    values: bus
    missing: absent
    description: the bus a port connects to
  Link_port_delay_source:
    key: [Link, port, snapshot]
    values: {source: snapshot}
    missing: absent
    description: >-
      the snapshot whose `p` a delayed port delivers at a snapshot, wrapping within the period where the port is cyclic.
      No row where the energy has not arrived yet, or where the port has no delay
  Load_bus:
    key: Load
    values: bus
    description: the bus the unit connects to
  Outage_Line:
    key: outage
    values: Line
    missing: absent
    description: the line an outage takes out
  Outage_Transformer:
    key: outage
    values: Transformer
    missing: absent
    description: the transformer an outage takes out
  Process_carrier:
    key: Process
    values: carrier
    description: the asset's carrier
  Process_maintenance_cover:
    key: {Process: Process, covered: snapshot, scenario: scenario, start: snapshot}
    missing: absent
    description: the snapshots an event covers, by the snapshot it starts in
  Process_port_Process:
    key: [Process, port]
    values: {owner: Process}
    missing: absent
    description: the ports each unit has, each to the unit itself
  Process_port_bus:
    key: [Process, port]
    values: bus
    missing: absent
    description: the bus a port connects to
  Process_port_delay_source:
    key: [Process, port, snapshot]
    values: {source: snapshot}
    missing: absent
    description: >-
      the snapshot whose `p` a delayed port delivers at a snapshot, wrapping within the period where the port is cyclic.
      No row where the energy has not arrived yet, or where the port has no delay
  StorageUnit_bus:
    key: StorageUnit
    values: bus
    description: the bus the unit connects to
  StorageUnit_carrier:
    key: StorageUnit
    values: carrier
    description: the asset's carrier
  Store_bus:
    key: Store
    values: bus
    description: the bus the unit connects to
  Store_carrier:
    key: Store
    values: carrier
    description: the asset's carrier
  Transformer_bus0:
    key: Transformer
    values: bus
    description: the bus the flow is measured at
  Transformer_bus1:
    key: Transformer
    values: bus
    description: the bus at the other end
  snapshot_period:
    key: snapshot
    values: period
    description: the investment period a snapshot falls in
parameters:
  Bus_attached:
    dims: [bus, snapshot]
    dtype: bool
    description: >-
      whether an active component is attached to the bus.
      No balance row where nothing is
  Bus_flow_based_zone:
    dims: [bus]
    dtype: bool
    description: whether the bus is a zone of a flow-based domain
  CVaR_alpha:
    dims: []
    missing: absent
    description: the CVaR confidence level; the tail is the other `1 - alpha` of the probability
  CVaR_omega:
    dims: []
    missing: 0.0
    description: >-
      the share of the operating cost priced at the CVaR.
      No value means no risk preference, and then there are no CVaR variables or rows
  Carrier_max_growth:
    dims: [carrier]
    missing: absent
    description: >-
      most capacity of a carrier added in a period.
      No value means no limit
  Carrier_max_relative_growth:
    dims: [carrier]
    description: the share of the previous period's additions that may be added on top
  Cycle_in_basis:
    dims: [cycle, period]
    dtype: bool
    description: >-
      whether a cycle label is in the period's cycle basis.
      No KVL row where it is not
  Cycle_scale:
    dims: []
    description: the factor on each KVL row, as the impedance weights are tiny
  Generator_active:
    dims: [Generator, snapshot]
    dtype: bool
    description: whether the asset is active in the snapshot's period, by build year and lifetime
  Generator_active_asset:
    dims: [Generator]
    dtype: bool
    description: whether the asset is active by its `active` flag alone, whatever its build year and lifetime
  Generator_big_m:
    dims: [Generator, scenario]
    missing: absent
    description: 'the bound the big-M rows of a committable extendable unit release: the largest power the unit could reach'
  Generator_capital_cost:
    dims: [Generator, scenario]
    description: 'cost of one unit of nominal capacity over the modelled horizon: the annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`'
  Generator_capital_cost_curve_cost:
    dims: [Generator, breakpoint]
    missing: absent
    description: 'the build cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `capital_cost` at its upper end'
  Generator_capital_cost_curve_nom:
    dims: [Generator, breakpoint]
    missing: absent
    description: >-
      the nominal capacity at each breakpoint of the piecewise `capital_cost` curve.
      No curve means no rows
  Generator_capital_weight:
    dims: [Generator]
    description: the summed weights of the periods the asset is active in
  Generator_committable:
    dims: [Generator]
    dtype: bool
    description: whether an on/off status decision gates the power
  Generator_down_time_brought_in:
    dims: [Generator, scenario, snapshot]
    description: one while the down time the unit brought into the horizon still runs
  Generator_e_sum_max:
    dims: [Generator, scenario]
    description: most energy over the horizon; infinity means no row
  Generator_e_sum_min:
    dims: [Generator, scenario]
    description: least energy over the horizon; minus infinity means no row
  Generator_efficiency_curve_p:
    dims: [Generator, breakpoint]
    missing: absent
    description: >-
      the output at each breakpoint of the piecewise `efficiency` curve: the `p_pu` breakpoints times `p_nom`.
      No curve means no rows
  Generator_efficiency_curve_primary:
    dims: [Generator, breakpoint]
    missing: absent
    description: 'the primary energy drawn at each breakpoint: output over `efficiency`, and zero where that is undefined'
  Generator_first_active:
    dims: [Generator, period]
    description: one in the first period the asset is active in, zero elsewhere
  Generator_maintainable:
    dims: [Generator]
    dtype: bool
    description: whether the unit must go into maintenance within the horizon, in any scenario
  Generator_maintenance_duration:
    dims: [Generator, scenario]
    missing: absent
    description: >-
      the hours, in `snapshot_weightings.generators`, one event covers.
      No row uses it; it enters through `maintenance_cover` and `maintenance_start_blocked`
  Generator_maintenance_events:
    dims: [Generator, scenario]
    dtype: int
    description: how many maintenance events take place within the horizon
  Generator_maintenance_pu:
    dims: [Generator, scenario]
    description: the share of the build a maintenance event takes off
  Generator_maintenance_start_blocked:
    dims: [Generator, scenario, snapshot]
    dtype: bool
    description: true where no event may start, because it would run past the horizon or into a snapshot the unit is not active in
  Generator_marginal_cost:
    dims: [Generator, scenario, snapshot]
    description: cost of one unit of energy dispatched
  Generator_marginal_cost_curve_cost:
    dims: [Generator, breakpoint]
    missing: absent
    description: 'the running cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `marginal_cost` at its upper end'
  Generator_marginal_cost_curve_p:
    dims: [Generator, breakpoint]
    missing: absent
    description: >-
      the power at each breakpoint of the piecewise `marginal_cost` curve: the per-unit breakpoints times nominal capacity.
      No curve means no rows
  Generator_marginal_cost_quadratic:
    dims: [Generator, scenario, snapshot]
    description: cost of the square of one unit of energy dispatched
  Generator_min_down_time:
    dims: [Generator, scenario]
    dtype: int
    description: least snapshots a unit stays off once stopped
  Generator_min_up_time:
    dims: [Generator, scenario]
    dtype: int
    description: least snapshots a unit stays on once started
  Generator_modules_installed:
    dims: [Generator, scenario]
    description: whole modules of a fixed modular build, its nominal capacity over the module size, and one where the build is not modular
  Generator_operational_limit_weight:
    dims: [Generator, global_constraint, scenario]
    missing: absent
    description: >-
      one where the unit is in the row's set.
      No row outside it
  Generator_overnight_cost:
    dims: [Generator]
    missing: absent
    description: >-
      the overnight cost of one unit of nominal capacity.
      No value means no row
  Generator_p_init:
    dims: [Generator, scenario]
    missing: 0.0
    description: >-
      the power the unit brought into the horizon where it came in on.
      No value means unknown: then there is no ramp row at the first snapshot
  Generator_p_max_pu:
    dims: [Generator, scenario, snapshot]
    description: most power, per unit of nominal power
  Generator_p_min_pu:
    dims: [Generator, scenario, snapshot]
    description: least power, per unit of nominal power
  Generator_p_min_pu_nonneg:
    dims: [Generator]
    dtype: bool
    description: true where no `p_min_pu` of the unit is negative, in any snapshot and scenario
  Generator_p_nom:
    dims: [Generator, scenario]
    description: nominal capacity
  Generator_p_nom_extendable:
    dims: [Generator]
    dtype: bool
    description: whether the nominal capacity is a decision
  Generator_p_nom_max:
    missing: absent
    dims: [Generator]
    description: most nominal capacity of an extendable asset, the smallest over the scenarios, as every scenario shares the build
  Generator_p_nom_min:
    dims: [Generator]
    description: least nominal capacity of an extendable asset, the largest over the scenarios, as every scenario shares the build
  Generator_p_nom_mod:
    dims: [Generator]
    missing: absent
    description: >-
      the module size the build comes in whole numbers of.
      No value means a continuous build
  Generator_p_nom_set:
    dims: [Generator]
    missing: absent
    description: >-
      a given nominal capacity of an extendable asset, the same in every scenario.
      No value means no row
  Generator_p_set:
    dims: [Generator, scenario, snapshot]
    missing: absent
    description: >-
      a given power schedule.
      No value means no row
  Generator_primary_energy_weight:
    dims: [Generator, global_constraint, scenario, snapshot]
    missing: absent
    description: >-
      the constrained carrier attribute per unit of output: the attribute over the efficiency, or the bare attribute where an `efficiency` curve gives the primary energy.
      No row where the carrier has no weight
  Generator_ramp_limit_down:
    dims: [Generator, scenario, snapshot]
    missing: absent
    description: >-
      most decrease of power between two snapshots, per unit of nominal power.
      The later snapshot's value applies.
      No value means no limit
  Generator_ramp_limit_shut_down:
    dims: [Generator, scenario]
    missing: absent
    description: >-
      most power in the snapshot before a unit stops, per unit of nominal power.
      No value means no limit
  Generator_ramp_limit_start_up:
    dims: [Generator, scenario]
    missing: absent
    description: >-
      most power in the snapshot a unit starts, per unit of nominal power.
      No value means no limit
  Generator_ramp_limit_up:
    dims: [Generator, scenario, snapshot]
    missing: absent
    description: >-
      most increase of power between two snapshots, per unit of nominal power.
      The later snapshot's value applies.
      No value means no limit
  Generator_shut_down_cost:
    dims: [Generator, scenario, snapshot]
    description: cost of one stop in this snapshot
  Generator_sign:
    dims: [Generator]
    description: the sign the power enters its bus's balance with
  Generator_stand_by_cost:
    dims: [Generator, scenario, snapshot]
    description: cost of one snapshot spent on
  Generator_start_up_cost:
    dims: [Generator, scenario, snapshot]
    description: cost of one start in this snapshot
  Generator_status_initial:
    dims: [Generator, scenario]
    description: >-
      one where the unit was on before the first snapshot, zero where off.
      A unit that is not committable counts as on
  Generator_tech_capacity_weight:
    dims: [Generator, global_constraint]
    missing: absent
    description: >-
      one where the asset is in the row's carrier-and-bus set.
      No row outside it, or where the asset is not active in the row's period
  Generator_up_time_brought_in:
    dims: [Generator, scenario, snapshot]
    description: one while the up time the unit brought into the horizon still runs
  GlobalConstraint_constant:
    dims: [global_constraint, scenario]
    description: the constant the total is held against
  GlobalConstraint_counts_snapshot:
    dims: [global_constraint, scenario, snapshot]
    dtype: bool
    missing: false
    description: whether the row counts the snapshot; all do unless the row names an `investment_period`
  GlobalConstraint_link_ptdf:
    dims: [Link, global_constraint, scenario, snapshot]
    missing: 0.0
    description: the factor of a `flow_based` row for a corridor link
  GlobalConstraint_ram:
    dims: [global_constraint, scenario, snapshot]
    missing: absent
    description: >-
      the remaining available margin of a `flow_based` row.
      No value means no row in that snapshot
  GlobalConstraint_sense:
    dims: [global_constraint, scenario]
    dtype: str
    description: 'the row''s sense per scenario: `<=`, `>=` or `==`'
  GlobalConstraint_type:
    dims: [global_constraint]
    dtype: str
    description: 'the row''s formula: `primary_energy`, `operational_limit`, `transmission_volume_expansion_limit`, `transmission_expansion_cost_limit`, `tech_capacity_expansion_limit` or `flow_based`'
  GlobalConstraint_zonal_ptdf:
    dims: [bus, global_constraint, scenario, snapshot]
    missing: 0.0
    description: the zonal power transfer distribution factor of a `flow_based` row for a zone bus
  Line_BODF:
    dims: [Line, outage, period]
    missing: absent
    description: >-
      the share of an outaged branch's flow the branch takes on (branch outage distribution factor).
      No row where the two are not active in the period or not in one sub-network
  Line_active:
    dims: [Line, snapshot]
    dtype: bool
    description: whether the asset is active in the snapshot's period, by build year and lifetime
  Line_active_asset:
    dims: [Line]
    dtype: bool
    description: whether the asset is active by its `active` flag alone, whatever its build year and lifetime
  Line_capital_cost:
    dims: [Line, scenario]
    description: 'cost of one unit of nominal capacity over the modelled horizon: the annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`'
  Line_capital_cost_curve_cost:
    dims: [Line, breakpoint]
    missing: absent
    description: 'the build cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `capital_cost` at its upper end'
  Line_capital_cost_curve_nom:
    dims: [Line, breakpoint]
    missing: absent
    description: >-
      the nominal capacity at each breakpoint of the piecewise `capital_cost` curve.
      No curve means no rows
  Line_capital_weight:
    dims: [Line]
    description: the summed weights of the periods the asset is active in
  Line_cycle_weight:
    dims: [Line, cycle, period]
    missing: absent
    description: >-
      the branch's series impedance, signed by its direction in the cycle, in the period's cycle basis.
      No row for a branch in no cycle
  Line_expansion_cost_weight:
    dims: [Line, global_constraint, scenario]
    missing: absent
    description: >-
      the branch's `capital_cost` without `fom_cost` where its carrier is in the row's set; in a multi-period run, times the objective weights of its active periods where the row names no period.
      No row outside the set, or where the branch is not active in the row's period
  Line_first_active:
    dims: [Line, period]
    description: one in the first period the asset is active in, zero elsewhere
  Line_loss_max:
    dims: [Line, scenario, snapshot]
    description: 'the loss at full rating: `r_pu_eff * (s_max_pu * s_nom_max)**2`, with `s_nom` for a fixed branch'
  Line_loss_offset:
    dims: [Line, scenario, segment, snapshot]
    missing: absent
    description: >-
      where each cut meets the loss axis.
      No value means no cut
  Line_loss_slope:
    dims: [Line, scenario, segment, snapshot]
    missing: absent
    description: >-
      the slope of each cut below the quadratic loss curve, a tangent or a secant.
      No value means no cut
  Line_overnight_cost:
    dims: [Line]
    missing: absent
    description: >-
      the overnight cost of one unit of nominal capacity.
      No value means no row
  Line_s_max_pu:
    dims: [Line, scenario, snapshot]
    description: most flow either way, per unit of nominal apparent power
  Line_s_nom:
    dims: [Line, scenario]
    description: nominal capacity
  Line_s_nom_extendable:
    dims: [Line]
    dtype: bool
    description: whether the nominal capacity is a decision
  Line_s_nom_max:
    dims: [Line]
    description: most nominal capacity of an extendable asset, the smallest over the scenarios, as every scenario shares the build
  Line_s_nom_min:
    dims: [Line]
    description: least nominal capacity of an extendable asset, the largest over the scenarios, as every scenario shares the build
  Line_s_nom_mod:
    dims: [Line]
    missing: absent
    description: >-
      the module size the build comes in whole numbers of.
      No value means a continuous build
  Line_s_nom_set:
    dims: [Line]
    missing: absent
    description: >-
      a given nominal capacity of an extendable asset, the same in every scenario.
      No value means no row
  Line_s_set:
    dims: [Line, scenario, snapshot]
    missing: absent
    description: >-
      a given flow schedule.
      No value means no row
  Line_tech_capacity_weight:
    dims: [Line, global_constraint]
    missing: absent
    description: >-
      one where the asset is in the row's carrier-and-bus set.
      No row outside it, or where the asset is not active in the row's period
  Line_v_ang_max:
    dims: [Line, scenario]
    missing: absent
    description: >-
      most voltage angle difference across the branch either way, in degrees.
      No value means no row
  Line_volume_weight:
    dims: [Line, global_constraint, scenario]
    missing: absent
    description: >-
      the branch's length where its carrier is in the row's set.
      No row outside it, or where the branch is not active in the row's period
  Line_x_pu_eff:
    dims: [Line, scenario]
    description: effective series reactance, per unit
  Link_active:
    dims: [Link, snapshot]
    dtype: bool
    description: whether the asset is active in the snapshot's period, by build year and lifetime
  Link_active_asset:
    dims: [Link]
    dtype: bool
    description: whether the asset is active by its `active` flag alone, whatever its build year and lifetime
  Link_big_m:
    dims: [Link, scenario]
    missing: absent
    description: 'the bound the big-M rows of a committable extendable unit release: the largest power the unit could reach'
  Link_capital_cost:
    dims: [Link, scenario]
    description: 'cost of one unit of nominal capacity over the modelled horizon: the annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`'
  Link_capital_cost_curve_cost:
    dims: [Link, breakpoint]
    missing: absent
    description: 'the build cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `capital_cost` at its upper end'
  Link_capital_cost_curve_nom:
    dims: [Link, breakpoint]
    missing: absent
    description: >-
      the nominal capacity at each breakpoint of the piecewise `capital_cost` curve.
      No curve means no rows
  Link_capital_weight:
    dims: [Link]
    description: the summed weights of the periods the asset is active in
  Link_committable:
    dims: [Link]
    dtype: bool
    description: whether an on/off status decision gates the power
  Link_down_time_brought_in:
    dims: [Link, scenario, snapshot]
    description: one while the down time the unit brought into the horizon still runs
  Link_e_sum_max:
    dims: [Link, scenario]
    description: most energy over the horizon; infinity means no row
  Link_e_sum_min:
    dims: [Link, scenario]
    description: least energy over the horizon; minus infinity means no row
  Link_efficiency:
    dims: [Link, port, scenario, snapshot]
    missing: absent
    description: >-
      energy a port delivers per unit of `p`, negative where it draws; the value at the snapshot the energy arrives applies.
      No port means no term
  Link_efficiency_curve_delivery:
    dims: [Link, breakpoint, port]
    missing: absent
    description: 'what a port delivers at each breakpoint of its `efficiency` curve: `p` times `efficiency`, and zero where that is undefined'
  Link_efficiency_curve_p:
    dims: [Link, breakpoint, port]
    missing: absent
    description: >-
      `p` at each breakpoint of a port's piecewise curve: the `p_pu` breakpoints times `p_nom`.
      No curve means no rows
  Link_expansion_cost_weight:
    dims: [Link, global_constraint, scenario]
    missing: absent
    description: >-
      the branch's `capital_cost` without `fom_cost` where its carrier is in the row's set; in a multi-period run, times the objective weights of its active periods where the row names no period.
      No row outside the set, or where the branch is not active in the row's period
  Link_first_active:
    dims: [Link, period]
    description: one in the first period the asset is active in, zero elsewhere
  Link_maintainable:
    dims: [Link]
    dtype: bool
    description: whether the unit must go into maintenance within the horizon, in any scenario
  Link_maintenance_duration:
    dims: [Link, scenario]
    missing: absent
    description: >-
      the hours, in `snapshot_weightings.generators`, one event covers.
      No row uses it; it enters through `maintenance_cover` and `maintenance_start_blocked`
  Link_maintenance_events:
    dims: [Link, scenario]
    dtype: int
    description: how many maintenance events take place within the horizon
  Link_maintenance_pu:
    dims: [Link, scenario]
    description: the share of the build a maintenance event takes off
  Link_maintenance_start_blocked:
    dims: [Link, scenario, snapshot]
    dtype: bool
    description: true where no event may start, because it would run past the horizon or into a snapshot the unit is not active in
  Link_marginal_cost:
    dims: [Link, scenario, snapshot]
    description: cost of one unit of energy dispatched
  Link_marginal_cost_curve_cost:
    dims: [Link, breakpoint]
    missing: absent
    description: 'the running cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `marginal_cost` at its upper end'
  Link_marginal_cost_curve_p:
    dims: [Link, breakpoint]
    missing: absent
    description: >-
      the power at each breakpoint of the piecewise `marginal_cost` curve: the per-unit breakpoints times nominal capacity.
