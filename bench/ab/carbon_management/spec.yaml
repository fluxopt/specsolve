  Store_marginal_cost_as_lp:
    condition: count(Store_marginal_cost_curve AND count(Store_marginal_cost_curve_bends_down, over=breakpoint) > 0, over=Store) == 0
    description: 'true where every `marginal_cost` curve of the component is convex: then the curves are stated as segment lines, else by incremental segments'
  Store_marginal_cost_curve:
    condition: count(Store_marginal_cost_curve_p, over=breakpoint) > 0 AND Store_active_asset
    description: an active asset with a piecewise `marginal_cost` curve
  Store_marginal_cost_curve_bends_down:
    condition: Store_marginal_cost_curve_p AND shift(Store_marginal_cost_curve_p, along=breakpoint, offset=1) AND shift(Store_marginal_cost_curve_p, along=breakpoint, offset=-1) AND (Store_marginal_cost_curve_cost - shift(Store_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Store_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - Store_marginal_cost_curve_p) > (shift(Store_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Store_marginal_cost_curve_cost) * (Store_marginal_cost_curve_p - shift(Store_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `marginal_cost` curve gets less steep
  Transformer_capital_cost_as_lp:
    condition: count(Transformer_capital_cost_curve AND count(Transformer_capital_cost_curve_bends_down, over=breakpoint) > 0, over=Transformer) == 0
    description: 'true where every `capital_cost` curve of the component is convex: then the curves are stated as segment lines, else by incremental segments'
  Transformer_capital_cost_curve:
    condition: count(Transformer_capital_cost_curve_nom, over=breakpoint) > 0 AND Transformer_s_nom_extendable AND Transformer_active_asset
    description: an extendable active asset with a piecewise `capital_cost` curve
  Transformer_capital_cost_curve_bends_down:
    condition: Transformer_capital_cost_curve_nom AND shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=1) AND shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=-1) AND (Transformer_capital_cost_curve_cost - shift(Transformer_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Transformer_capital_cost_curve_nom) > (shift(Transformer_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Transformer_capital_cost_curve_cost) * (Transformer_capital_cost_curve_nom - shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `capital_cost` curve gets less steep
  Transformer_lossy:
    condition: transmission_losses AND Transformer_active
    description: an active branch in a run with transmission losses
