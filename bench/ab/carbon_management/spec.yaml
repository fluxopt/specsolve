  Link_marginal_cost_curve_bends_down:
    condition: Link_marginal_cost_curve_p AND shift(Link_marginal_cost_curve_p, along=breakpoint, offset=1) AND shift(Link_marginal_cost_curve_p, along=breakpoint, offset=-1) AND (Link_marginal_cost_curve_cost - shift(Link_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Link_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - Link_marginal_cost_curve_p) > (shift(Link_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Link_marginal_cost_curve_cost) * (Link_marginal_cost_curve_p - shift(Link_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `marginal_cost` curve gets less steep
  Link_ramps_from_previous:
