  Store_p_min_pu:
    dims: [Store, scenario, snapshot]
    description: least power, per unit of nominal power
  Store_p_set:
    dims: [Store, scenario, snapshot]
    missing: absent
    description: >-
      a given power schedule.
      No value means no row
  Store_primary_energy_weight:
    dims: [Store, global_constraint, scenario]
    missing: absent
    description: >-
      the constrained carrier attribute per unit of energy stored.
      No row where the carrier has no weight
  Store_retention:
    dims: [Store, scenario, snapshot]
    description: share of the stored energy kept over a snapshot, `1 - standing_loss` to the power of the snapshot's store weighting
  Store_sign:
    dims: [Store]
    description: the sign the power enters its bus's balance with
  Store_spill_cost:
    dims: [Store, scenario, snapshot]
    description: cost of one unit of inflow spilled
  Store_split_dispatch:
    dims: [Store, scenario]
    dtype: bool
    description: >-
      whether the store charges through `p_store`, apart from its net power `p`: true where an efficiency is not one, a cost applies to one direction only, or `cycles_max` is finite.
      Otherwise `p_store` is zero
  Store_tech_capacity_weight:
    dims: [Store, global_constraint]
    missing: absent
    description: >-
      one where the asset is in the row's carrier-and-bus set.
      No row outside it, or where the asset is not active in the row's period
  Transformer_BODF:
    dims: [Transformer, outage, period]
    missing: absent
    description: >-
      the share of an outaged branch's flow the branch takes on (branch outage distribution factor).
      No row where the two are not active in the period or not in one sub-network
  Transformer_active:
    dims: [Transformer, snapshot]
    dtype: bool
    description: whether the asset is active in the snapshot's period, by build year and lifetime
  Transformer_active_asset:
    dims: [Transformer]
    dtype: bool
    description: whether the asset is active by its `active` flag alone, whatever its build year and lifetime
  Transformer_capital_cost:
    dims: [Transformer, scenario]
    description: 'cost of one unit of nominal capacity over the modelled horizon: the annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`'
  Transformer_capital_cost_curve_cost:
    dims: [Transformer, breakpoint]
    missing: absent
    description: 'the build cost at each breakpoint: zero at the first, then summed over the segments, each its width times the `capital_cost` at its upper end'
  Transformer_capital_cost_curve_nom:
    dims: [Transformer, breakpoint]
    missing: absent
    description: >-
      the nominal capacity at each breakpoint of the piecewise `capital_cost` curve.
      No curve means no rows
  Transformer_capital_weight:
    dims: [Transformer]
    description: the summed weights of the periods the asset is active in
  Transformer_cycle_weight:
    dims: [Transformer, cycle, period]
    missing: absent
    description: >-
      the branch's series impedance, signed by its direction in the cycle, in the period's cycle basis.
      No row for a branch in no cycle
  Transformer_loss_max:
    dims: [Transformer, scenario, snapshot]
    description: 'the loss at full rating: `r_pu_eff * (s_max_pu * s_nom_max)**2`, with `s_nom` for a fixed branch'
  Transformer_loss_offset:
    dims: [Transformer, scenario, segment, snapshot]
    missing: absent
    description: >-
      where each cut meets the loss axis.
      No value means no cut
  Transformer_loss_slope:
    dims: [Transformer, scenario, segment, snapshot]
    missing: absent
    description: >-
      the slope of each cut below the quadratic loss curve, a tangent or a secant.
      No value means no cut
  Transformer_overnight_cost:
    dims: [Transformer]
    missing: absent
    description: >-
      the overnight cost of one unit of nominal capacity.
      No value means no row
  Transformer_phase_shift_cycle_weight:
    dims: [Transformer, cycle, period, scenario]
    description: a varying transformer's sign in the cycle times π/180; zero for a fixed transformer or one in no cycle
  Transformer_phase_shift_fixed:
    dims: [Transformer, scenario, snapshot]
    description: the phase shift of a fixed transformer, in degrees; zero for a varying one
  Transformer_phase_shift_max:
    dims: [Transformer, scenario]
    description: most phase shift of a varying transformer, in degrees
  Transformer_phase_shift_min:
    dims: [Transformer, scenario]
    description: least phase shift of a varying transformer, in degrees
  Transformer_phase_shift_varying:
    dims: [Transformer, scenario]
    dtype: bool
    description: whether the phase shift is a decision, `phase_shift_min < phase_shift_max`
  Transformer_phase_shift_weight:
    dims: [Transformer, cycle, scenario, snapshot]
    missing: absent
    description: >-
      a fixed transformer's phase shift in radians, signed by its direction in the cycle.
      No row without a shift or a cycle
  Transformer_s_max_pu:
    dims: [Transformer, scenario, snapshot]
    description: most flow either way, per unit of nominal apparent power
  Transformer_s_nom:
    dims: [Transformer, scenario]
    description: nominal capacity
  Transformer_s_nom_extendable:
    dims: [Transformer]
    dtype: bool
    description: whether the nominal capacity is a decision
  Transformer_s_nom_max:
    dims: [Transformer]
    description: most nominal capacity of an extendable asset, the smallest over the scenarios, as every scenario shares the build
  Transformer_s_nom_min:
    dims: [Transformer]
    description: least nominal capacity of an extendable asset, the largest over the scenarios, as every scenario shares the build
  Transformer_s_nom_mod:
    dims: [Transformer]
    missing: absent
    description: >-
      the module size the build comes in whole numbers of.
      No value means a continuous build
  Transformer_s_nom_set:
    dims: [Transformer]
    missing: absent
    description: >-
      a given nominal capacity of an extendable asset, the same in every scenario.
      No value means no row
  Transformer_s_set:
    dims: [Transformer, scenario, snapshot]
    missing: absent
    description: >-
      a given flow schedule.
      No value means no row
  Transformer_v_ang_max:
    dims: [Transformer, scenario]
    missing: absent
    description: >-
      most voltage angle difference across the branch either way, in degrees.
      No value means no row
  Transformer_x_pu_eff:
    dims: [Transformer, scenario]
    description: effective series reactance, per unit
  deg2rad:
    dims: []
    description: radians per degree, to convert an angle given in degrees
  period_weight_objective:
    dims: [period]
    description: what a period's cost weighs in the objective
  period_weight_years:
    dims: [period]
    description: the years a period's energy counts for in an energy total
  scenario_weight:
    dims: [scenario]
    description: the probability of a scenario
  snapshot_weightings_generators:
    dims: [snapshot]
    description: hours a snapshot weighs in an energy total
  snapshot_weightings_objective:
    dims: [snapshot]
    description: hours a snapshot weighs in the objective
  snapshot_weightings_stores:
    dims: [snapshot]
    description: hours a snapshot weighs in a storage balance
  transmission_losses:
    dims: []
    dtype: bool
    description: whether the run models transmission losses
conditions:
  Generator_capital_cost_as_lp:
    condition: count(Generator_capital_cost_curve AND count(Generator_capital_cost_curve_bends_down, over=breakpoint) > 0, over=Generator) == 0
    description: 'true where every `capital_cost` curve of the component is convex: then the curves are stated as segment lines, else by incremental segments'
  Generator_capital_cost_curve:
    condition: count(Generator_capital_cost_curve_nom, over=breakpoint) > 0 AND Generator_p_nom_extendable AND Generator_active_asset
    description: an extendable active asset with a piecewise `capital_cost` curve
  Generator_capital_cost_curve_bends_down:
    condition: Generator_capital_cost_curve_nom AND shift(Generator_capital_cost_curve_nom, along=breakpoint, offset=1) AND shift(Generator_capital_cost_curve_nom, along=breakpoint, offset=-1) AND (Generator_capital_cost_curve_cost - shift(Generator_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Generator_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Generator_capital_cost_curve_nom) > (shift(Generator_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Generator_capital_cost_curve_cost) * (Generator_capital_cost_curve_nom - shift(Generator_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `capital_cost` curve gets less steep
  Generator_com_ext:
    condition: Generator_committable AND Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0) AND Generator_active
    description: >-
      a committed unit with an extendable build that is not modular.
      Its status is held against the chosen build by big-M rows
  Generator_committed:
    condition: Generator_committable AND Generator_active
    description: a committable unit, in a snapshot it is active in
  Generator_efficiency_curve:
    condition: count(Generator_efficiency_curve_p, over=breakpoint) > 0 AND Generator_active_asset AND count(GlobalConstraint_type == 'primary_energy', over=global_constraint) > 0
    description: an active asset with a piecewise `efficiency` curve, in a run with a `primary_energy` row
  Generator_maint_ext:
    condition: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod > 0) AND Generator_active
    description: a maintainable extendable unit, active in the snapshot, that is not both committable and modular
  Generator_marginal_cost_as_lp:
    condition: count(Generator_marginal_cost_curve AND count(Generator_marginal_cost_curve_bends_down, over=breakpoint) > 0, over=Generator) == 0 AND count(Generator_marginal_cost_curve AND Generator_committable, over=Generator) == 0
    description: 'true where every `marginal_cost` curve of the component is convex and no unit with a curve is committable: then the curves are stated as segment lines, else by incremental segments'
  Generator_marginal_cost_curve:
    condition: count(Generator_marginal_cost_curve_p, over=breakpoint) > 0 AND Generator_active_asset
    description: an active asset with a piecewise `marginal_cost` curve
  Generator_marginal_cost_curve_bends_down:
    condition: Generator_marginal_cost_curve_p AND shift(Generator_marginal_cost_curve_p, along=breakpoint, offset=1) AND shift(Generator_marginal_cost_curve_p, along=breakpoint, offset=-1) AND (Generator_marginal_cost_curve_cost - shift(Generator_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Generator_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - Generator_marginal_cost_curve_p) > (shift(Generator_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Generator_marginal_cost_curve_cost) * (Generator_marginal_cost_curve_p - shift(Generator_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `marginal_cost` curve gets less steep
  Generator_ramps_from_previous:
    condition: position(snapshot, within=snapshot_period[period]) > 0 OR (position(snapshot) == 0 AND (Generator_status_initial == 0 OR Generator_p_init))
    description: 'a snapshot whose ramp row has a previous power: any but the first of its period, and the first of the horizon where the unit came in off or with a `p_init`'
  Line_capital_cost_as_lp:
    condition: count(Line_capital_cost_curve AND count(Line_capital_cost_curve_bends_down, over=breakpoint) > 0, over=Line) == 0
    description: 'true where every `capital_cost` curve of the component is convex: then the curves are stated as segment lines, else by incremental segments'
  Line_capital_cost_curve:
    condition: count(Line_capital_cost_curve_nom, over=breakpoint) > 0 AND Line_s_nom_extendable AND Line_active_asset
    description: an extendable active asset with a piecewise `capital_cost` curve
  Line_capital_cost_curve_bends_down:
    condition: Line_capital_cost_curve_nom AND shift(Line_capital_cost_curve_nom, along=breakpoint, offset=1) AND shift(Line_capital_cost_curve_nom, along=breakpoint, offset=-1) AND (Line_capital_cost_curve_cost - shift(Line_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0)) * (shift(Line_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Line_capital_cost_curve_nom) > (shift(Line_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Line_capital_cost_curve_cost) * (Line_capital_cost_curve_nom - shift(Line_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
    description: a breakpoint where the `capital_cost` curve gets less steep
  Line_lossy:
    condition: transmission_losses AND Line_active
    description: an active branch in a run with transmission losses
