assumptions:
  Generator_big_m_where_committed_and_extendable:
    holds: Generator_big_m
    where: Generator_com_ext
    description: a committed extendable unit that is not modular has a big M
  Generator_capital_cost_curve_without_overnight_cost:
    holds: NOT Generator_overnight_cost
    where: Generator_capital_cost_curve
    description: an asset with a `capital_cost` curve has no `overnight_cost`, as the curve is already periodized
  Generator_efficiency_curve_on_a_fixed_build:
    holds: NOT Generator_p_nom_extendable AND Generator_p_nom != 0 AND Generator_p_nom < inf
    where: count(Generator_efficiency_curve_p, over=breakpoint) > 0
    description: an `efficiency` curve needs a fixed, non-zero, finite `p_nom`
  Generator_maintenance_build_cap_is_finite:
    holds: Generator_p_nom_max < inf
    where: Generator_maintainable AND Generator_p_nom_extendable
    description: a maintainable extendable unit has a finite largest nominal capacity
  Generator_maintenance_duration_fits_the_horizon:
    holds: Generator_maintenance_duration <= sum(snapshot_weightings_generators, over=snapshot)
    where: Generator_maintainable
    description: one event fits into the horizon
  Generator_maintenance_duration_positive:
    holds: Generator_maintenance_duration > 0
    where: Generator_maintainable
    description: an event lasts longer than zero
  Generator_maintenance_events_fit_the_horizon:
