name: CodSpeed

on:
  push:
    branches: [main]
    # Only paths that cannot change what the benchmark runs; config by path, never by extension.
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE
      - .gitignore
      - mkdocs.yml
      - .readthedocs.yaml
      - .pre-commit-config.yaml
      - .github/dependabot.yml
  # labeled, so applying trigger:bench to an open PR reaches the walltime job.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# main never cancels: a dropped run leaves a commit with no baseline for the next PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  memory:
    name: Memory (heap)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A report, not a gate: bench.yml fails a PR, and CodSpeed's app check is set not to fail.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # OIDC auth with CodSpeed — no upload token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-codspeed-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-codspeed-${{ runner.os }}-
      - run: pixi install -e codspeed

      # One thread, as peak liveness is a race; size s keeps under CodSpeed's ~2M-allocation advice.
      - uses: CodSpeedHQ/action@v5
        env:
          POLARS_MAX_THREADS: 1
        with:
          mode: memory
          run: pixi run -e codspeed pytest bench --sizes s --codspeed

  walltime:
    name: Wall time (macro runner)
    # An allowlist, so CodSpeed's own workflow_dispatch backfills never reach the metered runner.
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'trigger:bench')) }}
    # Metered bare metal: walltime on a shared runner is noise, so do not swap in a free one.
    runs-on: codspeed-macro
    timeout-minutes: 30
    # A report, not a gate: bench.yml fails a PR, and CodSpeed's app check is set not to fail.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-codspeed-macro-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-codspeed-macro-${{ runner.os }}-
      - run: pixi install -e codspeed

      # 2xs, where a fixed cost per query shows first; m and l: #520 showed overhead reading -5..-10% at m amortizes to ±4% at l.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: pixi run -e codspeed pytest bench --sizes 2xs m l --codspeed

  phases:
    name: Phases A/B (macro runner)
    # After walltime, whatever it concluded, so the two never share the metered runner.
    needs: walltime
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'trigger:bench') }}
    runs-on: codspeed-macro
    timeout-minutes: 30
    # A report, not a gate, as walltime is: a red run names a slower cell and fails nothing.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the A/B checks the base commit out beside this one
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-macro-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-macro-${{ runner.os }}-
      - run: pixi install -e bench

      - name: A/B of every phase, base against this PR
        run: >-
          pixi run -e bench python -m bench.ab.compare
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          --op solve --sizes tiny s --out ab.md

      - name: report
        if: always()
        run: |
          {
            echo '## Phases A/B: base → this PR'
            echo
            cat ab.md 2>/dev/null || echo 'The A/B wrote no table: its step above says why.'
          } >> "$GITHUB_STEP_SUMMARY"
