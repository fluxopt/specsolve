name: CodSpeed

on:
  push:
    branches: [main]
    # Only paths that cannot change what the benchmark runs; config by path, never by extension.
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE
      - .gitignore
      - mkdocs.yml
      - .readthedocs.yaml
      - .pre-commit-config.yaml
      - .github/dependabot.yml
  workflow_dispatch:

# main never cancels: a dropped run leaves a commit with no baseline in the history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIXI_LOCKED: "true"

jobs:
  memory:
    name: Memory (heap)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A history, not a gate: CodSpeed's app check is set not to fail.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # OIDC auth with CodSpeed — no upload token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-codspeed-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-codspeed-${{ runner.os }}-
      - run: pixi install -e codspeed

      # One thread, as peak liveness is a race; size s keeps under CodSpeed's ~2M-allocation advice.
      - uses: CodSpeedHQ/action@v5
        env:
          POLARS_MAX_THREADS: 1
        with:
          mode: memory
          run: pixi run -e codspeed pytest bench --sizes s --codspeed

  walltime:
    name: Wall time (macro runner)
    # An allowlist, so CodSpeed's own workflow_dispatch backfills never reach the metered runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Metered bare metal: walltime on a shared runner is noise, so do not swap in a free one.
    runs-on: codspeed-macro
    timeout-minutes: 30
    # A history, not a gate: CodSpeed's app check is set not to fail.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-codspeed-macro-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-codspeed-macro-${{ runner.os }}-
      - run: pixi install -e codspeed

      # 2xs, where a fixed cost per query shows first; m and l: #520 showed overhead reading -5..-10% at m amortizes to ±4% at l.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: pixi run -e codspeed pytest bench --sizes 2xs m l --codspeed
