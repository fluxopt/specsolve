name: pixi update

# Quarterly, like dependabot.yml: a pull request that moves pixi.lock to the newest releases.
# PIXI_UPDATE_TOKEN is a token with contents and pull-requests write on this repository: a pull
# request opened with GITHUB_TOKEN runs no workflow, so CI would never check it.
on:
  schedule:
    - cron: "37 5 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixi-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
      - name: move pixi.lock to the newest releases
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PIXI_UPDATE_TOKEN }}
          branch: build/pixi-update
          delete-branch: true
          add-paths: pixi.lock
          commit-message: "build(deps): pixi.lock moves to the newest release of every dependency"
          title: "build(deps): pixi.lock moves to the newest release of every dependency"
          body-path: diff.md
          labels: dependencies
