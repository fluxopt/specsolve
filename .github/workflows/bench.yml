name: Bench

on:
  pull_request:
    types: [labeled]

env:
  # The sweep solves, so its peak is the solver's as much as ours; `test_fresh` works in a
  # child process memray does not follow. CodSpeed leaves both out too.
  UNGATED: not test_sweep and not test_fresh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # to take the label off again when the run is done
  pull-requests: write

jobs:
  # One job per case and size, each measuring base then head on the same runner: a peak
  # depends on the machine too (polars sizes its thread pool by cores), so a pair never splits.
  measure:
    if: github.event.label.name == 'trigger:bench'
    runs-on: ubuntu-24.04
    # Two passes of both sizes in one job ran past 60 minutes (run 45210815076).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        size: [s, m]
        case: [dispatch, nodal, transport, profiled]
    env:
      CELL: ${{ matrix.case }}-${{ matrix.size }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base commit has to be reachable to check out
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      - name: warm the data cache
        run: |
          pixi run -e bench python - <<'PY'
          from bench.cases import CASES

          CASES['${{ matrix.case }}'].data(CASES['${{ matrix.case }}'].shape('${{ matrix.size }}'))
          PY

      # Only src/ from the base, so a harness change cannot read as a performance change.
      - name: baseline — the engine as it is on the base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- src/
          pixi run -e bench pytest bench/test_ladder.py --sizes ${{ matrix.size }} --cases ${{ matrix.case }} -k "$UNGATED" --benchmark-memory --benchmark-json=base-$CELL.json -q
          git checkout ${{ github.event.pull_request.head.sha }} -- src/

      - name: this PR's engine
        run: pixi run -e bench pytest bench/test_ladder.py --sizes ${{ matrix.size }} --cases ${{ matrix.case }} -k "$UNGATED" --benchmark-memory --benchmark-json=head-$CELL.json -q

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: peaks-${{ matrix.case }}-${{ matrix.size }}
          path: '*-${{ matrix.case }}-${{ matrix.size }}.json'

  gate:
    needs: measure
    if: always() && github.event.label.name == 'trigger:bench'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench
      - uses: actions/download-artifact@v8
        with:
          pattern: peaks-*
          merge-multiple: true

      - name: report
        if: always()
        run: |
          {
            echo '## Benchmarks: base → this PR'
            for base in base-*.json; do
              echo
              pixi run -e bench benchmem compare "$base" "head-${base#base-}" \
                --columns peak,rss,time --diff --format md
            done
            echo
            echo '`peak` is memray'"'"'s allocator high-water mark — it is what the gate reads.'
            echo '`rss` and `time` are reported but never gated: a shared runner'"'"'s wall clock and page cache are noise.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Peak only, at 20%: identical code spreads up to 16%, real changes moved peak 40-60%.
      - name: gate
        run: |
          failed=0
          for base in base-*.json; do
            [ -f "head-${base#base-}" ] || { echo "no head pass for ${base#base-}"; failed=1; continue; }
            pixi run -e bench benchmem compare "$base" "head-${base#base-}" \
              --columns peak --fail-on peak:20% || failed=1
          done
          [ '${{ needs.measure.result }}' = success ] || { echo 'a measure job did not finish'; failed=1; }
          exit $failed

      # Best-effort: a fork PR's token is read-only, and housekeeping must not fail the run.
      - name: hand the label back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label 'trigger:bench' || true
