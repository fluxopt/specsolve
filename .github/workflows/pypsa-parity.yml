name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The corpus is the release the committed rungs were certified from, or the commit
      # pyproject.toml references in its place. A later corpus adds rungs and data prep,
      # so moving the tag is its own change, with the rungs it adds.
      - name: the language and the corpus are mathspec at the commit pyproject.toml references, else at its floor
        id: pin
        run: |
          direct=$(grep -o 'mathspec @ git+[^"]*' pyproject.toml || true)
          floor=$(grep -o 'mathspec>=[^,"]*' pyproject.toml | cut -d= -f2 || true)
          if [ -n "$direct" ]; then
            echo "requirement=$direct" >> "$GITHUB_OUTPUT"
            echo "repository=$(echo "$direct" | sed -E 's#.*github\.com/([^@]+)@.*#\1#')" >> "$GITHUB_OUTPUT"
            echo "ref=${direct##*@}" >> "$GITHUB_OUTPUT"
          else
            echo "requirement=mathspec==$floor" >> "$GITHUB_OUTPUT"
            echo "repository=energy-models/mathspec" >> "$GITHUB_OUTPUT"
            echo "ref=v0.4.0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: corpus
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's specsolve
        run: >
          pixi exec -s uv uv run
          --with-editable .
          --with "$(grep -o 'linopy==[^"]*' pyproject.toml)"
          --with "${{ steps.pin.outputs.requirement }}"
          --with "pypsa @ git+https://github.com/PyPSA/PyPSA@51986084bfb68d38e5b64021649cb339448112cb"
          --with "highspy==1.15.1" --with "polars>=2.0"
          python differential/pypsa/parity.py corpus
      - name: the committed certificate, projections and tables are what this tree produces
        run: git diff --exit-code -- differential/pypsa && test -z "$(git status --porcelain differential/pypsa)"
