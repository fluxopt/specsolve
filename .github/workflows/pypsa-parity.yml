name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_LOCKED: "true"

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The corpus is the release the committed rungs were certified from, and PyPSA is the
      # commit that corpus pins, in the `parity` environment of pyproject.toml. A later corpus
      # adds rungs and data prep, so moving this tag is its own change, with the rungs it adds.
      - uses: actions/checkout@v7
        with:
          repository: energy-models/mathspec
          ref: v0.5.0a1
          path: corpus
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's specsolve
        run: pixi run -e parity python differential/pypsa/parity.py corpus
      - name: the committed certificate, projections and tables are what this tree produces
        run: git diff --exit-code -- differential/pypsa && test -z "$(git status --porcelain differential/pypsa)"
