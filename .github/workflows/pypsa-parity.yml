name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Ahead of a release, `[tool.uv.sources]` pins mathspec to a commit, and the project
      # installs that commit itself; a second pin beside it could not resolve.
      - name: the language is mathspec at the release pyproject.toml floors, or the commit it follows
        id: pin
        run: |
          if sed -n '/^\[tool.uv.sources\]/,/^\[/p' pyproject.toml | grep -q '^mathspec = '; then
            echo "with=" >> "$GITHUB_OUTPUT"
          else
            echo "with=--with mathspec==$(grep -o 'mathspec>=[^,"]*' pyproject.toml | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi
      # The corpus is the mathspec commit the committed rungs were certified from, the one
      # `[tool.uv.sources]` pins. A later corpus adds rungs and data prep, so moving this ref
      # is its own change, with the rungs it adds and the PyPSA commit that corpus pins.
      - uses: actions/checkout@v7
        with:
          repository: energy-models/mathspec
          ref: 5f1464c334c1012cdee2947d4d55b4d1d6bef40a
          path: corpus
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's specsolve
        run: >
          pixi exec -s uv uv run
          --with-editable .
          --with "$(grep -o 'linopy==[^"]*' pyproject.toml)"
          ${{ steps.pin.outputs.with }}
          --with "pypsa @ git+https://github.com/PyPSA/PyPSA@3625c8168b0b45a7936ddcb3a4da99dd608125ca"
          --with "highspy==1.15.1" --with "polars>=2.0"
          python differential/pypsa/parity.py corpus
      - name: the committed certificate, projections and tables are what this tree produces
        run: git diff --exit-code -- differential/pypsa && test -z "$(git status --porcelain differential/pypsa)"
