name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: the language is mathspec at the release pyproject.toml floors
        id: pin
        run: echo "version=$(grep -o 'mathspec>=[^"]*' pyproject.toml | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # The corpus is the release the committed rungs were certified from. A later corpus
      # adds rungs and data prep, so moving this tag is its own change, with the rungs it adds.
      - uses: actions/checkout@v7
        with:
          repository: energy-models/mathspec
          ref: v0.2.0
          path: corpus
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's specsolve
        run: >
          pixi exec -s uv uv run
          --with-editable .
          --with "$(grep -o 'linopy @ git+[^"]*' pyproject.toml)"
          --with "mathspec==${{ steps.pin.outputs.version }}"
          --with "pypsa==1.3.0" --with "highspy==1.15.1" --with "polars>=1.30"
          python differential/pypsa/parity.py corpus
      - name: the committed certificate, projections and tables are what this tree produces
        run: git diff --exit-code -- differential/pypsa && test -z "$(git status --porcelain differential/pypsa)"
