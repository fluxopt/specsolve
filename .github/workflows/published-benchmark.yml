name: Published benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'published: the whole ladder, hours. smoke: one rung, minutes.'
        type: choice
        options: [published, smoke]
        default: published
      sizes:
        description: 'Rungs to measure. Blank is the published ladder; "xs s m" is a short run that proves the pipeline in minutes.'
        type: string
        default: ''
      memory_budget:
        description: 'GB a cell may take before its arm stops climbing. Blank uses the published value; a lower one is a diagnostic run that completes and reports what each cell actually took.'
        type: string
        default: ''
      pr:
        description: 'A pull request to comment specsolve''s numbers on, which the trigger:published-bench label fills in. Blank comments nowhere.'
        type: string
        default: ''

# One box, so one run at a time, and never cancelled half way.
concurrency:
  group: benchmark-box
  cancel-in-progress: false

jobs:
  provision:
    name: bring the box up
    runs-on: ubuntu-24.04
    if: vars.BENCH_RUNNER != ''
    steps:
      - uses: hetznercloud/setup-hcloud@v2
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
          SNAPSHOT: ${{ vars.BENCH_SNAPSHOT }}
          TYPE: ${{ vars.BENCH_SERVER_TYPE || 'ccx33' }}
          LOCATION: ${{ vars.BENCH_LOCATION || 'nbg1' }}
          SSH_KEY: ${{ vars.BENCH_SSH_KEY }}
        run: |
          hcloud server delete "$BOX" 2>/dev/null || true
          hcloud server create --name "$BOX" --image "$SNAPSHOT" --type "$TYPE" \
            --location "$LOCATION" ${SSH_KEY:+--ssh-key "$SSH_KEY"} --start-after-create

  benchmark:
    needs: provision
    if: ${{ !cancelled() && needs.provision.result != 'failure' }}
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A warmed box carries a pixi binary that setup-pixi refuses to overwrite.
      - run: rm -f ~/.pixi/bin/pixi
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      # Committed results would publish as this run's; a case it could not measure stays a gap.
      - run: rm -f bench/results/latest*.json

      - if: inputs.mode == 'smoke'
        run: pixi run -e bench ladder-smoke
      # One step per case, so each uploads its results before a dying runner skips the rest.
      - if: inputs.mode != 'smoke'
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: nodal
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: network
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: sector
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: nodal
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: network
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: sector
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}

      - if: ${{ !cancelled() }}
        run: pixi run -e bench report
      - if: ${{ !cancelled() }}
        run: pixi run -e bench plot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-benchmark-${{ github.run_id }}
          path: |
            bench/results
            docs/about/benchmarks.md
            docs/about/benchmarks.json
          retention-days: 90

  teardown:
    name: take the box down
    needs: [provision, benchmark]
    if: always() && vars.BENCH_RUNNER != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: hetznercloud/setup-hcloud@v2
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
        run: |
          if hcloud server describe "$BOX" >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              hcloud server delete "$BOX" && break
              echo "delete failed, retry $attempt"; sleep 15
            done
          fi
          hcloud primary-ip delete "$BOX" 2>/dev/null || true
          hcloud server list
          hcloud primary-ip list

  # The branch's code runs here, so this job holds a read-only token and only renders.
  render:
    name: render the comment
    needs: benchmark
    if: ${{ always() && inputs.pr != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base commit has to be reachable to read its committed results
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      # Each case uploads as it finishes, so a box that died part way still leaves the cases before it.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: results-*-${{ github.run_id }}
          path: pr-results
          merge-multiple: true

      - name: the base branch's committed results
        run: |
          mkdir -p base-results
          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefOid --jq .baseRefOid) || base=origin/main
          git archive "$base" bench/results | tar -x -C base-results || true

      - name: render
        run: |
          pixi run -e bench python -m bench.comment pr-results base-results/bench/results \
            --run-url "$RUN_URL" --out comment.md \
          || printf '<!-- published-benchmark -->\n## Published benchmark\n\nThe comment did not render. The [run](%s) holds the results.\n' "$RUN_URL" > comment.md

      - uses: actions/upload-artifact@v7
        with:
          name: comment-${{ github.run_id }}
          path: comment.md
          retention-days: 7

  # Holds the write token, so it runs no code from the branch: gh and git on files from artifacts.
  post:
    name: comment, and open the results pull request
    needs: [benchmark, render]
    if: ${{ always() && inputs.pr != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      RESULTS: bench-results/pr-${{ inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: comment-${{ github.run_id }}
          path: comment

      # Only a run that finished every case may stand in for the published numbers.
      - uses: actions/download-artifact@v8
        if: ${{ needs.benchmark.result == 'success' }}
        continue-on-error: true
        with:
          name: published-benchmark-${{ github.run_id }}
          path: published

      # Only the result files and the two generated pages are taken from the artifact.
      - name: the results pull request
        id: results
        run: |
          [ -f published/docs/about/benchmarks.md ] && [ -f published/docs/about/benchmarks.json ] \
            && ls published/bench/results/*.json >/dev/null 2>&1 || { echo "no complete run: no results pull request"; exit 0; }
          git rm -rq --ignore-unmatch bench/results
          mkdir -p bench/results
          find published/bench/results -maxdepth 1 -type f -name '*.json' -exec cp {} bench/results/ \;
          cp published/docs/about/benchmarks.md published/docs/about/benchmarks.json docs/about/
          git add bench/results docs/about/benchmarks.md docs/about/benchmarks.json
          if git diff --cached --quiet; then echo "the run left the published files as they are"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "docs(benchmarks): the published benchmarks are re-measured on #$PR" \
            -m "Run $RUN_URL measured $GITHUB_SHA of $BRANCH."
          git push -q --force origin "HEAD:refs/heads/$RESULTS"
          url=$(gh pr list --repo "$REPO" --head "$RESULTS" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo "$REPO" --base "$BRANCH" --head "$RESULTS" \
              --title "docs(benchmarks): the published benchmarks are re-measured on #$PR" \
              --body "The [published benchmark run]($RUN_URL) on \`${GITHUB_SHA::7}\` of #$PR. Merge this into \`$BRANCH\` to publish these numbers with #$PR, or close it to only look. The comment on #$PR compares them with the committed ones; the docs preview of this pull request shows the page.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # One comment per pull request, edited by every later run.
      - name: comment
        env:
          RESULTS_PR: ${{ steps.results.outputs.url }}
        run: |
          [ -f comment/comment.md ] || printf '<!-- published-benchmark -->\n## Published benchmark\n\nThe comment did not render. The [run](%s) holds the results.\n' "$RUN_URL" > comment/comment.md
          if [ -n "$RESULTS_PR" ]; then
            n=${RESULTS_PR##*/}
            printf '\n\n📈 **[Charts of this run](https://specsolve--%s.org.readthedocs.build/en/%s/about/benchmarks/)**, in the docs preview of #%s once it has built. Merge #%s into `%s` to publish these numbers with this pull request, or close it.\n' \
              "$n" "$n" "$n" "$n" "$BRANCH" >> comment/comment.md
          fi
          cat comment/comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- published-benchmark -->")) | .id' | tail -n 1) || id=''
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment/comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment/comment.md
          fi || echo "::warning::the comment was not posted; the job summary holds it"

      - name: hand the label back
        if: always()
        run: gh pr edit "$PR" --repo "$REPO" --remove-label 'trigger:published-bench' || true
