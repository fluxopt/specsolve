name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, on seeds no pull request ran.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: the baseline seeds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-fuzz-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-fuzz-${{ runner.os }}-
      - name: A thousand random models, compared seed by seed with tests/fuzz/baseline.json
        run: pixi run fuzz

  fresh:
    name: fresh seeds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-fuzz-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-fuzz-${{ runner.os }}-
      # The day since 1970 picks the range, so each night runs seeds no earlier night ran.
      - name: Ten thousand seeds the baseline never ran
        run: |
          start=$(( 1000000 + $(date -u +%s) / 86400 * 10000 ))
          pixi run fuzz-fresh "$start:$(( start + 10000 ))"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: fuzz-findings
          if-no-files-found: ignore
